<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쉬지 않는 기도</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="쉬지 않는 기도">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#111111; --card:#1a1a1a; --card2:#222222; --line:#2c2c2c; --text:#E6E6E6; --muted:#9b9b9b; --faint:#6f6f6f;
  --accent:#d8b45a; --accentInk:#1a1406; --accentSoft:rgba(216,180,90,.14);
  --teal:#1F4D4D; --good:#62b88f; --goodSoft:rgba(98,184,143,.15); --urgent:#e3705f; --urgentSoft:rgba(227,112,95,.15);
  --warn:#e2a54a; --shadow:0 10px 30px rgba(0,0,0,.45);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
:root.light{
  --bg:#f5f3ee; --card:#ffffff; --card2:#f1eee7; --line:#e3ded3; --text:#1d1b18; --muted:#6b665d; --faint:#9a958b;
  --accent:#a8801f; --accentInk:#fff; --accentSoft:rgba(168,128,31,.12);
  --teal:#d7ecec; --good:#2f8a5f; --goodSoft:rgba(47,138,95,.12); --urgent:#c4452f; --urgentSoft:rgba(196,69,47,.1);
  --warn:#b7791f; --shadow:0 10px 30px rgba(0,0,0,.15);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:16px; line-height:1.55; letter-spacing:-0.005em;}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}
button,input,select,textarea{font-family:inherit; font-size:16px; color:inherit;}
a{color:inherit;}
.wrap{max-width:640px; margin:0 auto; padding:0 14px;}
header.top{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);}
header.top .wrap{display:flex; align-items:center; gap:8px; height:54px;}
.brand{font-weight:700; font-size:17px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand small{font-weight:500; color:var(--muted); font-size:13px; margin-left:6px;}
.iconbtn{background:none; border:0; width:40px; height:40px; border-radius:10px; display:grid; place-items:center; font-size:20px; cursor:pointer; color:var(--text);}
.iconbtn:active{background:var(--card2);}
nav.bottom{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);}
nav.bottom .wrap{display:flex; height:62px; padding:0;}
nav.bottom button{flex:1; background:none; border:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; font-size:12.5px; color:var(--muted); cursor:pointer;}
nav.bottom button .i{font-size:20px; line-height:1;}
nav.bottom button.on{color:var(--accent); font-weight:700;}
.fab{position:fixed; right:max(16px, calc(50% - 304px)); bottom:calc(76px + env(safe-area-inset-bottom)); z-index:31; width:58px; height:58px; border-radius:50%; border:0; background:var(--accent); color:var(--accentInk); font-size:32px; line-height:1; box-shadow:var(--shadow); cursor:pointer;}
h2{font-size:20px; margin:18px 0 6px;}
h3{font-size:16px; margin:16px 0 6px;}
.muted{color:var(--muted);} .faint{color:var(--faint);} .small{font-size:14px;} .tiny{font-size:12.5px;}
.row{display:flex; align-items:center; gap:8px;} .sp{flex:1;} .wrapflex{display:flex; flex-wrap:wrap; gap:6px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0;}
.btn{border:1px solid var(--line); background:var(--card2); border-radius:10px; padding:9px 14px; cursor:pointer; font-weight:600; font-size:15px; display:inline-flex; align-items:center; gap:6px; text-decoration:none;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accentInk);}
.btn.good{background:var(--goodSoft); border-color:transparent; color:var(--good);}
.btn.ghost{background:none;}
.btn.danger{color:var(--urgent); background:none;}
.btn.sm{padding:6px 10px; font-size:14px; border-radius:9px;}
.btn.block{width:100%; justify-content:center; padding:13px;}
.btn:disabled{opacity:.45;}
.chip{display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:1px 9px; font-size:12.5px; background:var(--card2); color:var(--muted); border:1px solid var(--line); white-space:nowrap;}
.chip.urgent{background:var(--urgentSoft); color:var(--urgent); border-color:transparent; font-weight:700;}
.chip.new{background:var(--accentSoft); color:var(--accent); border-color:transparent; font-weight:700;}
.chip.good{background:var(--goodSoft); color:var(--good); border-color:transparent;}
.chip.warn{color:var(--warn); border-color:transparent; background:rgba(226,165,74,.13); font-weight:700;}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none;}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; outline:none;}
textarea{min-height:70px; resize:vertical; line-height:1.5;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
label.f{display:block; font-size:13.5px; color:var(--muted); margin:12px 0 4px; font-weight:600;}
.seg{display:flex; background:var(--card2); border-radius:11px; padding:3px; gap:3px; border:1px solid var(--line);}
.seg button{flex:1; white-space:nowrap; border:0; background:none; padding:8px 4px; border-radius:9px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer;}
.seg button.on{background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.25);}
/* 오늘 */
.dayhead{padding:14px 0 4px;}
.dayhead .date{font-size:22px; font-weight:800;}
.dayhead .sub{color:var(--muted); font-size:14px;}
.weekdots{display:flex; gap:5px; margin-top:8px;}
.weekdots span{flex:1; text-align:center; font-size:12px; color:var(--faint); border-radius:8px; padding:3px 0; background:var(--card); border:1px solid var(--line);}
.weekdots span.done{background:var(--goodSoft); color:var(--good); border-color:transparent; font-weight:700;}
.weekdots span.today{outline:1.5px solid var(--accent);}
.step{background:var(--card); border:1px solid var(--line); border-radius:14px; margin:10px 0; overflow:hidden;}
.step .sh{display:flex; align-items:center; gap:10px; padding:14px; cursor:pointer;}
.step .num{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:var(--card2); font-weight:800; font-size:14px; flex:none;}
.step.done .num{background:var(--goodSoft); color:var(--good);}
.step.open .num{background:var(--accent); color:var(--accentInk);}
.step .st{font-weight:700; font-size:17px;}
.step .ss{color:var(--muted); font-size:13.5px; margin-left:auto; text-align:right;}
.step .sb{padding:0 14px 14px; display:none;}
.step.open .sb{display:block;}
.verse{background:var(--accentSoft); border-radius:12px; padding:14px; font-size:18px;}
.verse b{font-size:20px;}
.secttl{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--muted); font-size:14px; margin:16px 0 6px;}
.secttl::after{content:""; flex:1; height:1px; background:var(--line);}
.pcard{border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin:8px 0; background:var(--bg);}
.pcard.prayed{opacity:.62;}
.pcard .pn{font-weight:700; font-size:17px; cursor:pointer;}
.pcard .items{margin:6px 0 2px; padding:0; list-style:none;}
.pcard .items li{padding:5px 0 5px 14px; position:relative; cursor:pointer; font-size:15.5px; border-top:1px dashed var(--line);}
.pcard .items li:first-child{border-top:0;}
.pcard .items li::before{content:"•"; position:absolute; left:2px; color:var(--faint);}
.cbtn{width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--card2); display:grid; place-items:center; font-size:16px; cursor:pointer; text-decoration:none; padding:0;}
.cbtn.off{opacity:.35;}
.kk{font-weight:900; font-size:12px; color:#3a1d1d; background:#fee500; border-color:#fee500;}
.praybtn{margin-top:8px; width:100%; border:1px dashed var(--line); background:none; border-radius:10px; padding:9px; font-weight:700; color:var(--muted); cursor:pointer;}
.pcard.prayed .praybtn{border-style:solid; color:var(--good); background:var(--goodSoft); border-color:transparent;}
.namechips{display:flex; flex-wrap:wrap; gap:6px;}
.namechips button{border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:6px 12px; font-size:15px; cursor:pointer;}
.namechips button.on{background:var(--goodSoft); color:var(--good); border-color:transparent;}
.note{background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px; margin:8px 0;}
.note .ap{font-size:17px; font-weight:700; margin:4px 0;}
.empty{color:var(--muted); font-size:14.5px; padding:6px 0;}
.finish{margin:18px 0 8px;}
.banner{border-radius:12px; padding:11px 12px; background:var(--accentSoft); font-size:14.5px; margin:10px 0;}
.banner.warn{background:rgba(226,165,74,.13);}
/* 사람 */
.daygrid .dayb{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:8px 0;}
.daygrid .dayb.today{border-color:var(--accent);}
.dayb .dh{display:flex; align-items:center; gap:8px; font-weight:800; margin-bottom:6px;}
.pchip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:5px 11px; font-size:15px; cursor:pointer; margin:3px 3px 0 0;}
.pchip .pin{font-size:11px;}
.bar{height:6px; border-radius:3px; background:var(--card2); overflow:hidden; flex:1; max-width:120px;}
.bar i{display:block; height:100%; background:var(--accent);}
/* 시트 */
.ov{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.sheet{background:var(--card); width:100%; max-width:640px; max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; padding:6px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow:var(--shadow);}
.sheet .grab{width:40px; height:5px; border-radius:3px; background:var(--line); margin:6px auto 4px;}
.sheet .shd{display:flex; align-items:center; gap:8px; position:sticky; top:-6px; background:var(--card); padding:8px 0; z-index:2;}
.sheet .shd b{font-size:18px; flex:1;}
.actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
.actions .btn{flex:1; justify-content:center;}
.radio{display:flex; flex-wrap:wrap; gap:6px;}
.radio button{border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:8px 12px; font-size:14.5px; cursor:pointer;}
.radio button.on{background:var(--accent); color:var(--accentInk); border-color:var(--accent); font-weight:700;}
.check{display:flex; align-items:center; gap:8px; margin:10px 0; font-size:15px;}
.check input{width:20px; height:20px; accent-color:var(--accent);}
.list .li{display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-top:1px solid var(--line); cursor:pointer;}
.list .li:first-child{border-top:0;}
.tl .yr{font-size:22px; font-weight:800; margin:18px 0 4px;}
.tl .ent{border-left:2px solid var(--accent); padding:4px 0 12px 14px; margin-left:6px; position:relative; cursor:pointer;}
.tl .ent::before{content:""; position:absolute; left:-6px; top:10px; width:10px; height:10px; border-radius:50%; background:var(--accent);}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom)); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:12px; z-index:80; font-size:15px; font-weight:600; max-width:88vw; text-align:center; box-shadow:var(--shadow);}
.help p{margin:6px 0;} .help h3{margin-top:18px;}
.vini{display:flex; flex-wrap:wrap; gap:3px; margin-top:8px; position:sticky; top:46px; z-index:2; background:var(--card); padding:4px 0;}
.vini button{min-width:30px; height:30px; border:1px solid var(--line); background:var(--bg); border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; color:var(--text); padding:0 4px;}
.vini button:disabled{opacity:.25;}
.vrow{content-visibility:auto; contain-intrinsic-size:auto 58px; scroll-margin-top:130px;}
@media (min-width: 900px){
  .wrap{max-width:1180px; padding:0 28px;}
  html,body{font-size:17px;}
  .fab{right:max(24px, calc(50% - 570px));}
  .ov{align-items:center;}
  .sheet{max-width:760px; border-radius:18px; max-height:88vh;}
  .pgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:0 12px;}
  .daygrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:0 12px; align-items:start;}
  .ngrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:0 12px; align-items:start;}
  .todaycols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.6fr); gap:0 18px; align-items:start;}
  .todaycols .colL{position:sticky; top:62px;}
  .step .sh{padding:16px 18px;} .step .sb{padding:0 18px 18px;}
}
.linkbtn{background:none; border:0; color:var(--accent); font-weight:700; cursor:pointer; padding:0; font-size:inherit;}
/* ===== 디자인 다듬기: 작은 휴대폰에서 읽기 쉽고 누르기 쉽게 =====
   · 누르는 것은 모두 최소 44px  · 글자는 본문 17px, 보조 14px 이상  · 간격은 4의 배수 */
:root{ --faint:#7d7d7d; --r:14px; --tap:44px; }
:root.light{ --faint:#8a857b; }
html,body{font-size:17px; line-height:1.6;}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom));}
.wrap{padding:0 16px;}
.small{font-size:14.5px;} .tiny{font-size:13px;}
h2{font-size:22px; font-weight:800; letter-spacing:-.02em; margin:20px 0 8px;}
h3{font-size:17px; font-weight:800; margin:22px 0 8px; letter-spacing:-.01em;}
/* 머리줄 */
header.top{background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
header.top .wrap{height:52px;}
.brand{font-size:17px; font-weight:800; letter-spacing:-.02em;}
.iconbtn{width:var(--tap); height:var(--tap); border-radius:12px; color:var(--muted);}
.iconbtn svg{width:24px; height:24px;}
/* 아래 탭 */
nav.bottom{background:color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);}
nav.bottom .wrap{height:64px;}
nav.bottom button{font-size:12.5px; gap:3px; font-weight:600; color:var(--faint); padding-top:2px;}
nav.bottom button .i{display:grid; place-items:center; width:52px; height:30px; border-radius:15px; transition:background .15s;}
nav.bottom button .i svg{width:23px; height:23px;}
nav.bottom button.on{color:var(--accent); font-weight:800;}
nav.bottom button.on .i{background:var(--accentSoft);}
.fab{width:56px; height:56px; bottom:calc(80px + env(safe-area-inset-bottom)); font-size:30px; display:grid; place-items:center; box-shadow:0 6px 18px rgba(0,0,0,.4);}
.fab svg{width:28px; height:28px;}
/* 단추 */
.btn{min-height:var(--tap); padding:10px 16px; border-radius:12px; font-size:16px; justify-content:center;}
.btn.sm{min-height:40px; padding:8px 14px; font-size:15px; border-radius:11px;}
.btn.block{min-height:52px; font-size:17px; border-radius:14px;}
.btn.primary{font-weight:800;}
.btn:active,.cbtn:active,.praybtn:active,.namechips button:active,.radio button:active,.pchip:active{transform:scale(.97);}
.linkbtn{min-height:36px; display:inline-flex; align-items:center;}
.linkbtn.tiny{min-height:32px;}
.chip{font-size:13px; padding:2px 10px; line-height:1.5;}
/* 입력 */
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{min-height:48px; padding:11px 14px; border-radius:12px; font-size:17px;}
textarea{min-height:88px;}
label.f{font-size:14.5px; margin:16px 0 6px;}
.check{min-height:var(--tap); font-size:16px;}
.check input{width:22px; height:22px;}
.seg{border-radius:13px; padding:4px;}
.seg button{min-height:40px; font-size:15px; border-radius:10px;}
.radio{gap:8px;}
.radio button{min-height:var(--tap); padding:8px 14px; font-size:15.5px; border-radius:12px; flex:1 1 auto;}
/* 카드 · 단계 */
.card,.step{border-radius:18px;}
.card{padding:16px;}
.step{margin:12px 0;}
.step .sh{min-height:64px; padding:12px 16px; gap:12px;}
.step .num{width:32px; height:32px; font-size:15px;}
.step .st{font-size:18px; font-weight:800; letter-spacing:-.01em;}
.step .ss{font-size:14px;}
.step .sb{padding:0 16px 16px;}
.secttl{font-size:14.5px; margin:22px 0 8px;}
.note{border-radius:14px; padding:14px;}
.note .ap{font-size:17.5px; line-height:1.5;}
.banner{border-radius:14px; padding:14px; font-size:15.5px; line-height:1.55;}
.empty{font-size:15.5px;}
/* 오늘 머리 */
.dayhead{padding:18px 0 4px;}
.dayhead .date{font-size:26px; font-weight:800; letter-spacing:-.03em; line-height:1.25;}
.dayhead .sub{font-size:13.5px; color:var(--faint); margin-top:2px;}
.weekdots{gap:6px; margin-top:14px;}
.weekdots span{height:36px; display:grid; place-items:center; font-size:14px; font-weight:600; border-radius:10px; padding:0;}
.weekdots span.today{outline:2px solid var(--accent); outline-offset:-2px; color:var(--text);}
.mottos{margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden;}
.mline{display:flex; gap:12px; align-items:flex-start; padding:12px 16px; cursor:pointer; min-height:56px;}
.mline + .mline{border-top:1px solid var(--line);}
.mline .mi{font-size:18px; line-height:1.4; flex:none; width:22px; text-align:center;}
.mline .ml{font-size:13px; color:var(--muted); font-weight:600;}
.mline .mt{font-size:16px; line-height:1.5; font-weight:600; margin-top:1px;}
/* 사람 카드 */
.pcard{border-radius:16px; padding:14px 14px 12px; margin:10px 0; background:var(--card2); border-color:transparent;}
:root.light .pcard{background:var(--card); border-color:var(--line);}
.pcard .pn{font-size:18px; font-weight:800; letter-spacing:-.01em;}
.pcard .row{min-height:var(--tap);}
.pcard .pn{white-space:nowrap; flex:none;}
.pcard .row .chip{min-width:0; overflow:hidden; text-overflow:ellipsis; flex-shrink:1;}
.pcard .items{margin:8px 0 4px;}
.pcard .items li{padding:10px 0 10px 16px; font-size:16.5px; line-height:1.5; border-top:1px solid var(--line);}
.pcard .items li::before{top:10px;}
.cbtn{width:var(--tap); height:var(--tap); border-radius:12px; font-size:18px; background:var(--bg); flex:none;}
.praybtn{min-height:48px; margin-top:10px; border:0; background:var(--bg); border-radius:12px; font-size:16px; color:var(--text);}
.pcard.prayed{opacity:1;}
.pcard.prayed .pn,.pcard.prayed .items{opacity:.55;}
.pcard.prayed .praybtn{background:var(--goodSoft); color:var(--good);}
.namechips{gap:8px;}
.namechips button{min-height:var(--tap); padding:8px 16px; font-size:16px; border-radius:22px; background:var(--card2); border-color:transparent;}
.namechips button.on{background:var(--goodSoft); color:var(--good);}
.pchip{min-height:40px; padding:6px 14px; font-size:16px; margin:4px 4px 0 0; background:var(--card2); border-color:transparent;}
:root.light .namechips button,:root.light .pchip{background:var(--card2);}
/* 오늘의 OAT */
.oatgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
.oatgrid button{display:flex; align-items:center; gap:8px; text-align:left; min-height:52px; padding:8px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); cursor:pointer; font-size:15.5px; font-weight:600; line-height:1.3;}
.oatgrid button .ck{flex:none; width:22px; height:22px; border-radius:7px; border:2px solid var(--faint); display:grid; place-items:center; font-size:14px; font-weight:900;}
.oatgrid button .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;}
.oatgrid button .sb2{display:block; font-size:12.5px; font-weight:500; color:var(--muted);}
.oatgrid button.on{background:var(--goodSoft); border-color:transparent; color:var(--good);}

.qtlabel{font-size:14px; font-weight:700; color:var(--accent);}

.qtsum{margin-top:10px; padding:12px 14px; border-radius:12px; background:var(--bg); cursor:pointer; font-size:16px;}

.qtcal button{min-height:42px; border-radius:10px; border:0; background:var(--card2); color:var(--muted); font-size:15px; cursor:pointer;}
.qtcal button.on{background:var(--accent); color:#1a1a1a; font-weight:800;}
.qtcal button.today{outline:2px solid var(--accent); outline-offset:-2px;}
input[type=month]{min-height:48px; padding:11px 14px; border-radius:12px; font-size:17px; width:100%; background:var(--card2); color:var(--text); border:1px solid var(--line);}

/* 찾기 */
input[type=search]{min-height:52px; padding:12px 16px; border-radius:14px; font-size:17px; width:100%; background:var(--card2); color:var(--text); border:1.5px solid var(--accent); -webkit-appearance:none;}
.srsec{font-size:14.5px; font-weight:800; color:var(--accent); margin:20px 0 4px;}

.srmain{flex:1; min-width:0; cursor:pointer; font-size:16px; line-height:1.45;}
.srrow .btn.sm{flex:none; min-height:40px;}

.srperson > .srrow{border-bottom:0;}
.srperson .srrow + .srrow, .srperson > .srrow ~ .srrow{padding-left:14px; border-bottom:0; border-top:1px dashed var(--line); min-height:48px;}
mark{background:var(--accentSoft); color:var(--accent); border-radius:3px; padding:0 1px;}
/* 설치 안내 */
.installbar{display:flex; align-items:center; gap:12px; margin-top:14px; padding:12px 14px; border-radius:16px; background:var(--accentSoft); font-size:15px; line-height:1.45;}

@media (display-mode: standalone){ .installbar{display:none !important;} }

  .wrap{padding:0 12px;}
  .dayhead .date{font-size:23px;}

}
@media (min-width: 900px){
  .pgrid .pcard{margin:6px 0;}
  .oatgrid{grid-template-columns:repeat(4, 1fr);}
}

<script>
"use strict";
var APP_VERSION = "2026-11-12-1";
var KEY = "swgido.v1";

/* ============ 날짜 ============ */
function pad(n){ return String(n).padStart(2,"0"); }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function today(){ return ymd(new Date()); }
function parseYmd(s){ var p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(s,n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function dayNum(s){ var p=s.split("-").map(Number); return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5); }
function diff(a,b){ return dayNum(b)-dayNum(a); }           /* b - a (일) */
function dow(s){ return parseYmd(s).getDay(); }
function weekStart(s){ return addDays(s,-dow(s)); }
var DOW = ["일","월","화","수","목","금","토"];
function fmtDate(s){ if(!s) return ""; var d=parseYmd(s); return (d.getMonth()+1)+"월 "+d.getDate()+"일"; }
function fmtFull(s){ var d=parseYmd(s); return d.getFullYear()+". "+(d.getMonth()+1)+". "+d.getDate()+"."; }
function monthSlot(s){ return ((dayNum(s)%28)+28)%28; }

/* ============ 공통 ============ */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function toast(msg){ document.querySelectorAll('.toast').forEach(function(x){ x.remove(); }); var t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); },2200); }

/* ============ 저장 ============ */
var GROUP_COLORS = ["#d8b45a","#5fa8d3","#62b88f","#c97cc4","#e3705f","#8f8fe0","#d48a45","#7fb3a8","#b8b05a","#a0a0a0"];
function defaultState(){
  var names = ["파이오니아팀","한국네비게이토","STA지구","선교사","병원 직원","처가·친척","열방"];
  return {
    v:1,
    groups: names.map(function(n,i){ return {id:"dg"+i, name:n, color:GROUP_COLORS[i%GROUP_COLORS.length], fixedDay:null, def:true}; }),
    people: [], items: [], notes: [], logs: {},
    settings: { cap:10, theme:"dark", short:false, lastBackup:"", started:today(),
      tpl:{ pray:"오늘 {이름}님을 위해 기도했어요. 요즘 어떠세요?",
            due:"어제 일은 어떻게 되었는지요? 계속 기도하고 있어요.",
            answer:"기도하던 일이 응답되었다니 함께 하나님께 감사해요!",
            bday:"{이름}님, 생일 축하드려요! 오늘 특별히 축복하며 기도했습니다." } }
  };
}
var S;
function load(){
  try{ var raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : null; }catch(e){ S = null; }
  if(!S || !S.v) S = defaultState();
  var d = defaultState();
  S.settings = Object.assign({}, d.settings, S.settings||{});
  S.settings.tpl = Object.assign({}, d.settings.tpl, S.settings.tpl||{});
  ["people","items","notes","groups","promises","oat","reviews","qt","qtplan"].forEach(function(k){ if(!Array.isArray(S[k])) S[k]=[]; });
  if(!S.logs) S.logs = {};
  if(!S.tomb) S.tomb = {};
  S.notes.forEach(function(n){ if(n.source==="주일설교") n.source="주일 메시지"; });
  if(!S.settings.sync) S.settings.sync = {};
  SNAP = snapshot(true);
}
/* ---- 고친 시각 기록 (기기 간 합치기용) ----
   저장할 때마다 이전 저장과 비교해 바뀐 기록에 mt(고친 시각)를 찍고, 사라진 기록은 tomb(지운 기록)에 남긴다. */
var KINDS = ["groups","people","items","notes","promises","oat","reviews","qt","qtplan"];
var LOCAL_SETTINGS = ["theme","short","lastBackup","sync","started"];
var SNAP = null;
function recJson(r){ var o={}; Object.keys(r).forEach(function(k){ if(k!=="mt") o[k]=r[k]; }); return JSON.stringify(o); }
function sharedSettings(st){ return {cap:st.cap, tpl:st.tpl}; }
function snapshot(fillMissing){
  var now = Date.now(), cur = {};
  KINDS.forEach(function(kind){ S[kind].forEach(function(r){ if(fillMissing && !r.mt) r.mt = now; cur[kind+":"+r.id] = recJson(r); }); });
  Object.keys(S.logs).forEach(function(d){ var L=S.logs[d]; if(fillMissing && !L.mt) L.mt = now; cur["log:"+d] = recJson(L); });
  if(fillMissing && !S.settings.smt) S.settings.smt = now;
  cur["settings"] = JSON.stringify(sharedSettings(S.settings));
  return cur;
}
function stamp(){
  var now = Date.now(), cur = {};
  KINDS.forEach(function(kind){ S[kind].forEach(function(r){ var k=kind+":"+r.id, j=recJson(r); cur[k]=j; if(!r.mt || (SNAP && SNAP[k]!==j)) r.mt=now; }); });
  Object.keys(S.logs).forEach(function(d){ var L=S.logs[d], k="log:"+d, j=recJson(L); cur[k]=j; if(!L.mt || (SNAP && SNAP[k]!==j)) L.mt=now; });
  var sj = JSON.stringify(sharedSettings(S.settings)); cur["settings"]=sj; if(SNAP && SNAP["settings"]!==sj) S.settings.smt=now;
  if(SNAP) Object.keys(SNAP).forEach(function(k){ if(!(k in cur) && k!=="settings") S.tomb[k]=now; });
  var cutoff = now - 200*864e5; Object.keys(S.tomb).forEach(function(k){ if(S.tomb[k]<cutoff) delete S.tomb[k]; });
  var changed = !SNAP || Object.keys(cur).some(function(k){ return SNAP[k]!==cur[k]; }) || Object.keys(SNAP).length!==Object.keys(cur).length;
  SNAP = cur;
  return changed;
}
var memOnly = false;
function save(opts){
  var changed = stamp();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ if(!memOnly){ memOnly=true; toast("이 화면에서는 저장이 안 되어 임시로만 기억합니다"); } }
  if(changed && !(opts && opts.noSync)) Sync.soon();
}
/* ---- 합치기: 다른 기기(또는 백업)의 기록을 지금 기록과 합친다 ---- */
function uniq(a){ var o=[], m={}; (a||[]).forEach(function(x){ if(!m[x]){ m[x]=1; o.push(x); } }); return o; }
function mergeInto(R){
  var T = {}, k, stats = {added:0, updated:0, removed:0};
  [S.tomb||{}, R.tomb||{}].forEach(function(src){ for(k in src) T[k] = Math.max(T[k]||0, src[k]); });
  KINDS.forEach(function(kind){
    var m = {}, order = [];
    S[kind].forEach(function(r){ m[r.id]=r; order.push(r.id); });
    (R[kind]||[]).forEach(function(r){
      if(!r || !r.id) return;
      var l = m[r.id];
      if(!l){ m[r.id]=r; order.push(r.id); stats.added++; }
      else if((r.mt||0) > (l.mt||0)){ if(kind==="items") r.prayed = uniq((r.prayed||[]).concat(l.prayed||[])).sort(); m[r.id]=r; stats.updated++; }
      else if(kind==="items"){ l.prayed = uniq((l.prayed||[]).concat(r.prayed||[])).sort(); }
    });
    S[kind] = order.map(function(id){ return m[id]; }).filter(function(r){ var t=T[kind+":"+r.id]; return !(t && t >= (r.mt||0)); });
  });
  var RL = R.logs || {};
  Object.keys(RL).forEach(function(d){
    var a = S.logs[d], b = RL[d]; if(!b) return;
    if(!a){ S.logs[d] = b; return; }
    var newer = (b.mt||0) > (a.mt||0) ? b : a, older = newer===a ? b : a;
    var L = JSON.parse(JSON.stringify(newer));
    L.prayed = uniq((a.prayed||[]).concat(b.prayed||[]));
    L.steps = Object.assign({}, older.steps||{}, newer.steps||{});
    L.done = !!(a.done || b.done);
    if(a.oat || b.oat) L.oat = Object.assign({}, older.oat||{}, newer.oat||{});
    ["praiseMemo","confess","evening"].forEach(function(f){ if(!L[f] && older[f]) L[f]=older[f]; });
    L.thanks = (newer.thanks||[]).map(function(x,i){ return x || (older.thanks||[])[i] || ""; });
    (older.thanks||[]).slice((newer.thanks||[]).length).forEach(function(x){ L.thanks.push(x); });
    L.mt = Math.max(a.mt||0, b.mt||0);
    S.logs[d] = L;
  });
  if(R.settings && (R.settings.smt||0) > (S.settings.smt||0)){ S.settings.cap = R.settings.cap || S.settings.cap; S.settings.tpl = Object.assign({}, S.settings.tpl, R.settings.tpl||{}); S.settings.smt = R.settings.smt; }
  S.tomb = T;
  SNAP = snapshot(false);
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(dedupeGroups()) save({noSync:true});   /* 지운 그룹은 기록(tomb)에 남겨 다른 기기에서도 사라지게 */
  return stats;
}
function dedupeGroups(){
  var byName = {}, drop = {}, changed = false;
  S.groups.slice().sort(function(a,b){ return a.id<b.id?-1:1; }).forEach(function(g){
    var k = (g.name||"").replace(/\s+/g,"").toLowerCase();
    if(!k) return;
    if(!byName[k]){ byName[k] = g; return; }
    var keep = byName[k];
    if(keep.fixedDay==null && g.fixedDay!=null) keep.fixedDay = g.fixedDay;
    drop[g.id] = keep.id;
  });
  if(!Object.keys(drop).length) return false;
  S.people.forEach(function(p){ if(p.groupId && drop[p.groupId]){ p.groupId = drop[p.groupId]; changed = true; } });
  S.groups = S.groups.filter(function(g){ return !drop[g.id]; });
  return true;
}
function sharedState(){ var st={}; Object.keys(S.settings).forEach(function(k){ if(LOCAL_SETTINGS.indexOf(k)<0) st[k]=S.settings[k]; }); return {v:1, app:"swgido", groups:S.groups, people:S.people, items:S.items, notes:S.notes, promises:S.promises, oat:S.oat, reviews:S.reviews, qt:S.qt, qtplan:S.qtplan, logs:S.logs, tomb:S.tomb, settings:st}; }
function log(d){ if(!S.logs[d]) S.logs[d] = {steps:{}, thanks:["","",""], prayed:[], praiseMemo:"", confess:""}; var L=S.logs[d]; if(!L.steps) L.steps={}; if(!L.thanks) L.thanks=["","",""]; if(!L.prayed) L.prayed=[]; return L; }

/* ============ 조회 ============ */
function person(id){ for(var i=0;i<S.people.length;i++) if(S.people[i].id===id) return S.people[i]; return null; }
function group(id){ for(var i=0;i<S.groups.length;i++) if(S.groups[i].id===id) return S.groups[i]; return null; }
function item(id){ for(var i=0;i<S.items.length;i++) if(S.items[i].id===id) return S.items[i]; return null; }
function note(id){ for(var i=0;i<S.notes.length;i++) if(S.notes[i].id===id) return S.notes[i]; return null; }
function activeItemsOf(pid){ return S.items.filter(function(it){ return it.personId===pid && it.status==="active"; }); }
function weight(p){ return Math.max(1, activeItemsOf(p.id).length); }
function gColor(gid){ var g=group(gid); return g ? g.color : "#777"; }
function gName(gid){ var g=group(gid); return g ? g.name : ""; }
function circleName(c){ return {daily:"매일",weekly:"매주",monthly:"한 달"}[c] || ""; }

/* ============ 요일 배정 — 섞어서 고르게 ============ */
function weeklyPeople(){ return S.people.filter(function(p){ return p.circle==="weekly"; }); }
function dayLoads(exceptId){
  var load=[0,0,0,0,0,0,0], cnt=[0,0,0,0,0,0,0], gc={};
  weeklyPeople().forEach(function(p){
    if(p.id===exceptId || p.day==null) return;
    load[p.day]+=weight(p); cnt[p.day]++;
    var k=(p.groupId||"_")+"|"+p.day; gc[k]=(gc[k]||0)+1;
  });
  return {load:load, cnt:cnt, gc:gc};
}
function bestDay(p, L){
  var g = group(p.groupId);
  if(g && g.fixedDay!=null) return g.fixedDay;
  var best=0, bestScore=Infinity;
  for(var d=0; d<7; d++){
    var same = L.gc[(p.groupId||"_")+"|"+d]||0;
    var score = L.load[d] + same*1.0 + L.cnt[d]*0.01 + d*0.0001;
    if(score < bestScore){ bestScore=score; best=d; }
  }
  return best;
}
function place(p, L){ var d=bestDay(p,L); L.load[d]+=weight(p); L.cnt[d]++; var k=(p.groupId||"_")+"|"+d; L.gc[k]=(L.gc[k]||0)+1; return d; }
function assignPerson(p){
  if(p.circle==="weekly"){
    if(p.day==null){ p.day = bestDay(p, dayLoads(p.id)); p.dayFixed=false; }
    var g=group(p.groupId); if(g && g.fixedDay!=null){ p.day=g.fixedDay; }
  } else if(p.circle==="monthly"){
    if(p.slot==null){
      var c=new Array(28).fill(0); S.people.forEach(function(q){ if(q!==p && q.circle==="monthly" && q.slot!=null) c[q.slot]++; });
      var start = monthSlot(today()), best=start, bv=Infinity;
      for(var i=0;i<28;i++){ var s=(start+i)%28; if(c[s]<bv){ bv=c[s]; best=s; } }
      p.slot = best;
    }
  }
}
function rebalance(){
  var L={load:[0,0,0,0,0,0,0], cnt:[0,0,0,0,0,0,0], gc:{}};
  var fixed=[], free=[];
  weeklyPeople().forEach(function(p){
    var g=group(p.groupId);
    if(g && g.fixedDay!=null){ p.day=g.fixedDay; fixed.push(p); }
    else if(p.dayFixed && p.day!=null) fixed.push(p);
    else free.push(p);
  });
  fixed.forEach(function(p){ L.load[p.day]+=weight(p); L.cnt[p.day]++; var k=(p.groupId||"_")+"|"+p.day; L.gc[k]=(L.gc[k]||0)+1; });
  /* 큰 그룹부터, 그룹 안에서는 무거운 사람부터, 그룹을 번갈아 가며 배정 */
  var byG={}; free.forEach(function(p){ (byG[p.groupId||"_"]=byG[p.groupId||"_"]||[]).push(p); });
  var lists=Object.keys(byG).map(function(k){ return byG[k].sort(function(a,b){ return weight(b)-weight(a) || a.name.localeCompare(b.name); }); })
    .sort(function(a,b){ return b.length-a.length; });
  var order=[], more=true;
  for(var r=0; more; r++){ more=false; lists.forEach(function(l){ if(r<l.length){ order.push(l[r]); more=true; } }); }
  order.sort(function(a,b){ return weight(b)-weight(a); }); /* 무거운 사람 먼저 (안정 정렬로 그룹 교차 유지) */
  order.forEach(function(p){ p.day=place(p,L); });
  save();
}
function balanceInfo(){
  var L=dayLoads(null), ws=weeklyPeople().length;
  var mx=Math.max.apply(null,L.load), mn=Math.min.apply(null,L.load), avg=L.load.reduce(function(a,b){return a+b;},0)/7;
  return {L:L, uneven: ws>=7 && (mx-mn)>=2 && (mx-mn) > avg*0.2, perDay: ws/7};
}

function specialsFor(t){
  var map = {}, md = t.slice(5);
  function add(key, pid, it, tag){
    var e = map[key] || (map[key] = {pid:pid, tags:{}, items:{}});
    if(it){ (e.items[it.id] = e.items[it.id] || []).push(tag); } else e.tags[tag]=1;
  }
  S.items.forEach(function(it){
    if(it.status!=="active" || it.personId==="me") return;
    var key = it.personId || ("none:"+it.id);
    if(it.urgent) add(key, it.personId, it, "긴급");
    var age = diff(it.created, t);
    if(age>=0 && age<=2) add(key, it.personId, it, "새 제목");
    if(it.due){ var dd=diff(t,it.due); if(dd===0) add(key,it.personId,it,"오늘"); else if(dd===1) add(key,it.personId,it,"내일"); else if(dd===-1) add(key,it.personId,it,"결과 묻기"); }
  });

  return map;
}
/* 생일·기념일 */
function normDate(v){
  v = String(v||"").trim(); if(!v) return null; var m;
  if((m=/^(\d{4})[-.\/년\s]*(\d{1,2})[-.\/월\s]*(\d{1,2})/.exec(v))) return {y:Number(m[1]), md:pad(m[2])+"-"+pad(m[3])};
  if((m=/^(\d{4})(\d{2})(\d{2})$/.exec(v))) return {y:Number(m[1]), md:m[2]+"-"+m[3]};
  if((m=/^-{1,2}(\d{2})-?(\d{2})$/.exec(v))) return {y:null, md:m[1]+"-"+m[2]};
  if((m=/^(\d{1,2})[-.\/월\s]+(\d{1,2})/.exec(v))) return {y:null, md:pad(m[1])+"-"+pad(m[2])};
  if((m=/^(\d{2})(\d{2})$/.exec(v))) return {y:null, md:m[1]+"-"+m[2]};
  return null;
}
/* 음력(한국 음력 = dangi 달력) → 양력. 휴대폰 브라우저에 들어 있는 달력 계산을 씀 */
var LUNAR_FMT = null, LCACHE = {};
function lunarFmt(){
  if(LUNAR_FMT !== null) return LUNAR_FMT;
  try{ var f = new Intl.DateTimeFormat("ko-KR-u-ca-dangi", {year:"numeric", month:"numeric", day:"numeric", timeZone:"UTC"}); LUNAR_FMT = /dangi|chinese/.test(f.resolvedOptions().calendar) ? f : false; }
  catch(e){ LUNAR_FMT = false; }
  return LUNAR_FMT;
}
function lunarYearMap(yy){
  if(LCACHE[yy]) return LCACHE[yy];
  var f = lunarFmt(), map = {}; if(!f) return (LCACHE[yy] = map);
  for(var ms = Date.UTC(yy,0,15,12); ms <= Date.UTC(yy+1,1,25,12); ms += 864e5){
    var o = {}; f.formatToParts(new Date(ms)).forEach(function(x){ o[x.type] = x.value; });
    if(Number(o.relatedYear || o.year) !== yy || /윤|bis|leap/i.test(o.month)) continue;
    var key = Number(String(o.month).replace(/\D/g,"")) + "-" + Number(o.day);
    if(!map[key]){ var d = new Date(ms); map[key] = d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); }
  }
  return (LCACHE[yy] = map);
}
function lunarToSolar(yy, m, d){ var map = lunarYearMap(yy); return map[m+"-"+d] || map[m+"-"+(d-1)] || null; }
function solarToLunarText(ymdStr){ var f=lunarFmt(); if(!f) return ""; var o={}; f.formatToParts(new Date(ymdStr+"T12:00:00Z")).forEach(function(x){ o[x.type]=x.value; }); return "음 "+o.month+"/"+o.day; }
/* 다음에 돌아오는 날(오늘 포함)까지 며칠, 그날의 양력 월-일 */
function nextOccur(t, md, lunar){
  if(lunar && lunarFmt()){
    var m = Number(md.slice(0,2)), d = Number(md.slice(3)), y = Number(t.slice(0,4));
    for(var yy = y-1; yy <= y+1; yy++){ var sol = lunarToSolar(yy, m, d); if(sol && diff(t, sol) >= 0) return {days:diff(t, sol), md:sol.slice(5), date:sol}; }
  }
  var n = daysUntilMD(t, md); return {days:n, md:addDays(t, n).slice(5), date:addDays(t, n)};
}
function personEvents(p, t){
  t = t || today();
  var out = [], b = normDate(p.birthday);
  if(b){ var o = nextOccur(t, b.md, !!p.birthLunar); out.push({kind:"birthday", label:"생일", md:o.md, days:o.days, date:o.date, y:b.y, lunar:!!p.birthLunar, lmd:b.md}); }
  (p.anniversaries||[]).forEach(function(a){ var d=normDate(a.date); if(d){ var o=nextOccur(t, d.md, !!a.lunar); out.push({kind:"anniv", label:a.label||"기념일", md:o.md, days:o.days, date:o.date, y:d.y, lunar:!!a.lunar, lmd:d.md}); } });
  return out;

function daysUntilMD(t, md){

  if(md==="02-29" && !(y%4===0 && (y%100!==0 || y%400===0))) cand = y+"-02-28";
  var d = diff(t, cand); if(d<0){ cand=(y+1)+"-"+(md==="02-29"?"02-28":md); d = diff(t, cand); }

}

function groupOptions(cur){ return '<option value="">(그룹 없음)</option>'+S.groups.map(function(g){ return '<option value="'+g.id+'" '+(g.id===cur?"selected":"")+'>'+esc(g.name)+'</option>'; }).join(""); }
function personOptions(cur){
  var h = '<option value="me" '+(cur==="me"?"selected":"")+'>나 (개인 기도)</option><option value="" '+(!cur?"selected":"")+'>대상 없이 받은 기도제목</option>';
  var gs = S.groups.concat([{id:null,name:"그룹 없음"}]);
  gs.forEach(function(g){ var ps=S.people.filter(function(p){ return (p.groupId||null)===g.id; }).sort(function(a,b){ return a.name.localeCompare(b.name); }); if(!ps.length) return;
    h += '<optgroup label="'+esc(g.name)+'">'+ps.map(function(p){ return '<option value="'+p.id+'" '+(p.id===cur?"selected":"")+'>'+esc(p.name)+'</option>'; }).join("")+'</optgroup>'; });
  return h + '<option value="__new">＋ 새 사람…</option>';
}

    '<label class="f">메모</label><textarea id="pMemo" placeholder="관계, 기억할 것" style="min-height:'+(p.memo&&p.memo.length>80?160:70)+'px">'+esc(p.memo)+'</textarea>';

      '<div class="tiny muted" style="margin-top:12px">최근 연락: '+(p.lastContact?fmtDate(p.lastContact):"없음")+'</div>';
  }

function annRow(a){ a=a||{label:"",date:""}; return '<div class="row ann" style="margin-top:6px"><input type="text" class="annLabel" value="'+esc(a.label)+'" placeholder="결혼기념일" style="flex:1"><input type="text" class="annDate" value="'+esc(a.date)+'" placeholder="05-17" style="flex:1"><label class="check" style="margin:0;white-space:nowrap;font-size:13px"><input type="checkbox" class="annLunar" '+(a.lunar?"checked":"")+'>음력</label><button type="button" class="iconbtn" data-act="delAnn" aria-label="지우기">✕</button></div>'; }

    '<label class="f">고칠 것 (선택 — 자백 기도에 올라옴)</label><input type="text" id="nFix" value="'+esc(n.fix)+'" placeholder="아침에 뉴스부터 보는 습관">';
  if(!isNew){
    h += '<label class="f">상태</label>'+radio("nStatus", [["active","진행 중"],["fruit","열매(습관이 됨)"],["archived","보관"]], n.status);

  '<h3>저녁 돌아보기</h3><p>오후 5시가 지나면 "오늘" 화면 아래에 나옵니다. 감사 하나, 고칠 것 하나를 적으면 다음 날 아침 감사·자백 기도로 이어집니다.</p>'+
  '<h3>음력 생일</h3><p>사람 카드에서 생일 옆 "음력"에 체크하면 해마다 양력 날짜를 계산해 알려 드립니다.</p>'+
  '<h3>카카오톡에서 바로 넣기</h3><p>앱을 설치한 휴대폰·탭에서는 카톡 메시지를 길게 눌러 공유 → "쉬지 않는 기도"를 고르면 빠른 입력에 그 글이 채워져 열립니다.</p>'+
  '<h3>연락처 가져오기</h3><p>"사람" 탭 → 📂 연락처 가져오기. 삼성 연락처 앱에서 VCF 파일로 내보낸 뒤 그 파일을 고르면, 이름·전화·생일·기념일·메모를 함께 가져옵니다. 생일과 기념일은 일주일 전부터 "오늘" 화면에 미리 보이고, 당일에는 축복 기도로 올라옵니다.</p>'+
  '<h3>기도제목 넣기</h3><p>어디서든 ＋ 버튼. 단톡방 기도제목은 복사한 뒤 "붙여넣기"를 누르세요. 새 제목은 3일간 "오늘 특별히"에 매일 올라오고, 긴급은 응답될 때까지 매일, 날짜가 있는 제목은 전날과 당일에 올라오고 다음 날 "결과 묻기"가 뜹니다.</p>'+
  '<h3>응답</h3><p>기도제목을 눌러 "응답됨"을 고르고 내용과 날짜를 적으세요. 다음 날 감사 기도에 올라오고 "응답" 탭에 연대기로 쌓입니다.</p>'+
  '<h3>말씀노트</h3><p>메시지나 성경읽기에서 받은 적용을 적으면 1·3·7·14·30·90·180일 뒤에 "오늘"의 말씀 상기에 다시 올라옵니다. "고칠 것"은 자백 기도로 이어집니다.</p>'+
  '<h3>연락</h3><p>📞 바로 전화, 💬 문구를 고쳐 문자·카카오톡으로 보냅니다. 연락하면 최근 연락일이 기록됩니다.</p>'+
  '<h3>폰과 탭 함께 쓰기</h3><p>⚙︎ → "기기 간 동기화"를 켜면 본인 구글 드라이브를 거쳐 기기끼리 기록이 맞춰집니다. 올리기 전에 비밀 문구로 암호화하므로 드라이브에서 열어 봐도 내용을 알 수 없습니다. 위의 ☁️ 표시가 "탭"이면 한 번 눌러 주세요(구글 연결은 한 시간쯤 유지됩니다). 인터넷이 없을 때 적은 것도 나중에 연결되면 합쳐집니다.</p>'+
  '<h3>백업</h3><p>모든 기록은 휴대폰 안에만 저장되어 다른 사람이 볼 수 없습니다. 대신 휴대폰을 바꾸면 사라지므로 ⚙︎ → 백업 보내기로 일주일에 한 번 보관해 두세요.</p></div>';
  openSheet("사용설명서", h);

function parseContactsText(text){

    var name = (m ? l.replace(m[0],"") : l).replace(/^(이름|성명|name)\s*[:：]/i,"").replace(/(휴대폰|휴대전화|전화|핸드폰|mobile|tel|phone)\s*[:：]?/ig,"").replace(/[,:;|\-–·]+/g," ").trim();
    if(m && name){ rows.push({name:name, tel:m[0].trim()}); pending=null; }

function qpDecode(str, charset){
  var bytes = [], i = 0;
  while(i < str.length){
    var c = str[i];
    if(c==="=" && /^[0-9A-Fa-f]{2}$/.test(str.substr(i+1,2))){ bytes.push(parseInt(str.substr(i+1,2),16)); i+=3; }
    else { var code=str.charCodeAt(i); if(code<128) bytes.push(code); else { var enc=unescape(encodeURIComponent(c)); for(var k=0;k<enc.length;k++) bytes.push(enc.charCodeAt(k)); } i++; }
  }
  try{ return new TextDecoder((charset||"utf-8").toLowerCase()).decode(new Uint8Array(bytes)); }catch(e){ return new TextDecoder("utf-8").decode(new Uint8Array(bytes)); }
}
function vUnescape(v){ return v.replace(/\\n/gi,"\n").replace(/\\([,;\\])/g,"$1"); }
function parseVcf(text){
  text = String(text||"").replace(/^﻿/,"").replace(/\r\n?/g,"\n");
  /* 줄 이어붙이기: quoted-printable의 끝 '=' 과 공백으로 시작하는 연속 줄 */
  var raw = text.split("\n"), lines = [];
  for(var i=0;i<raw.length;i++){
    var l = raw[i];
    if(lines.length && /^[ \t]/.test(l)){ lines[lines.length-1] += l.slice(1); continue; }
    while(/ENCODING=QUOTED-PRINTABLE/i.test(l.split(":")[0]) && /=$/.test(l) && i+1<raw.length){ l = l.slice(0,-1) + raw[++i]; }
    lines.push(l);
  }
  var cards = [], cur = null;
  lines.forEach(function(line){
    if(/^BEGIN:VCARD/i.test(line)){ cur = {fn:"", n:"", tels:[], bday:"", anns:[], note:"", org:"", title:"", cats:""}; return; }
    if(/^END:VCARD/i.test(line)){ if(cur) cards.push(cur); cur=null; return; }
    if(!cur) return;
    var ci = line.indexOf(":"); if(ci<0) return;
    var head = line.slice(0,ci), value = line.slice(ci+1);
    var parts = head.split(";"), name = parts[0].replace(/^item\d+\./i,"").toUpperCase(), params = parts.slice(1).join(";").toUpperCase();
    if(/QUOTED-PRINTABLE/.test(params)){ var cs=/CHARSET=([\w-]+)/.exec(params); value = qpDecode(value, cs&&cs[1]); }
    value = vUnescape(value).trim();
    if(name==="FN") cur.fn = value;
    else if(name==="N") cur.n = value.split(";").slice(0,2).reverse().join("").trim() || value.replace(/;/g," ").trim();
    else if(name==="TEL") cur.tels.push({v:value, cell:/CELL|MOBILE/.test(params)});
    else if(name==="BDAY") cur.bday = value;
    else if(name==="ANNIVERSARY" || name==="X-ANNIVERSARY") cur.anns.push({label:"결혼기념일", date:value});
    else if(name==="X-ABDATE") cur.anns.push({label:"기념일", date:value});
    else if(name==="NOTE") cur.note = cur.note ? cur.note+"\n"+value : value;
    else if(name==="ORG") cur.org = value.replace(/;+/g," ").trim();
    else if(name==="TITLE") cur.title = value;
    else if(name==="CATEGORIES") cur.cats = value;
    else if(name==="X-ANDROID-CUSTOM" && /contact_event/.test(value)){
      var f = value.split(";"), date = f[1], type = f[2], lab = f[3];
      if(lab && /^(=[0-9A-Fa-f]{2})+$/.test(lab)) lab = qpDecode(lab, "utf-8");
      if(type==="3" && !cur.bday) cur.bday = date;
      else cur.anns.push({label: type==="1" ? "결혼기념일" : (lab || "기념일"), date: date});
    }
  });
  return cards.map(function(c){
    var cell = c.tels.filter(function(t){ return t.cell; }).map(function(t){ return t.v; });
    var b = normDate(c.bday);
    return {name:(c.fn||c.n||"").trim(), tel:pickMobile(cell.concat(c.tels.map(function(t){ return t.v; }))),
      birthday: b ? (b.y ? b.y+"-"+b.md : b.md) : "", anniversaries: c.anns.map(function(a){ var d=normDate(a.date); return d ? {label:a.label, date:(d.y?d.y+"-"+d.md:d.md)} : null; }).filter(Boolean),
      memo: [c.org, c.title, c.note].filter(Boolean).join("\n"), cats: c.cats};
  }).filter(function(r){ return r.name; });
}

function chosung(str){ var o=""; for(var i=0;i<str.length;i++){ var c=str.charCodeAt(i)-0xAC00; o += (c>=0 && c<11172) ? CHO.charAt(Math.floor(c/588)) : str.charAt(i); } return o; }
function initialOf(name){ var c=name.charCodeAt(0)-0xAC00; if(c>=0 && c<11172){ var k=CHO.charAt(Math.floor(c/588)); return ({"ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ"})[k]||k; } return /[a-z]/i.test(name.charAt(0)) ? "A" : "#"; }
function vMatch(r, i){
  var f = VCF.f;
  if(f==="sel" && !VCF.sel[i]) return false;
  if(f==="event" && !r.birthday && !r.anniversaries.length) return false;
  if(f==="memo" && !r.memo) return false;
  if(f==="new" && (VCF.done[i] || S.people.some(function(p){ return p.name===r.name; }))) return false;
  var q = VCF.q.trim().toLowerCase().replace(/\s+/g,""); if(!q) return true;
  if(/^[ㄱ-ㅎ]+$/.test(q)) return chosung(r.name).indexOf(q)>=0;
  return (r.name+" "+r.tel+" "+r.tel.replace(/\D/g,"")+" "+r.memo+" "+r.cats).toLowerCase().replace(/\s+/g,"").indexOf(q)>=0;
}

function mergePerson(ex, r){
  if(!ex.phone && r.tel) ex.phone = r.tel;
  if(!ex.birthday && r.birthday) ex.birthday = r.birthday;
  ex.anniversaries = ex.anniversaries || [];
  (r.anniversaries||[]).forEach(function(a){ if(!ex.anniversaries.some(function(x){ return x.date===a.date; })) ex.anniversaries.push(a); });
  if(r.memo && (ex.memo||"").indexOf(r.memo)<0) ex.memo = ex.memo ? ex.memo+"\n"+r.memo : r.memo;
}

/* ============ 기기 간 동기화 (구글 드라이브 · 암호화) ============

var GOOGLE_CLIENT_ID = "859749044751-dp0pkdrgluds7ruki40gbll9jmkl7401.apps.googleusercontent.com";
var SYNC_FILE = "쉬지않는기도_동기화.json";
var Sync = (function(){
  var tokenClient = null, busy = false, timer = null, pendingRender = false;
  function cfg(){ return S.settings.sync || (S.settings.sync = {}); }
  function clientId(){ return GOOGLE_CLIENT_ID || cfg().clientId; }
  function tok(){ var c=cfg(); return (c.token && c.tokenExp && Date.now() < c.tokenExp-60000) ? c.token : null; }
  function setStatus(st, msg){ var c=cfg(); c.status=st; c.msg=msg||""; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} paint(); }
  function paint(){

  }
  function statusText(){ var c=cfg(); if(!c.on) return "꺼져 있음"; if(busy) return "동기화 중…";
    var last = c.last ? new Date(c.last) : null, lt = last ? (last.getMonth()+1)+"/"+last.getDate()+" "+pad(last.getHours())+":"+pad(last.getMinutes()) : "아직 없음";
    return (c.status==="error" ? '<span style="color:var(--urgent)">'+esc(c.msg)+'</span><br>' : '') + "마지막 동기화: "+lt + (tok() ? "" : ' · <span style="color:var(--accent)">위의 ☁️를 누르면 동기화</span>'); }
  function loadGis(){
    return new Promise(function(res, rej){
      if(window.google && google.accounts && google.accounts.oauth2) return res();
      var sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
      sc.onload = function(){ res(); }; sc.onerror = function(){ rej(new Error("구글 로그인 도구를 불러오지 못했습니다 (인터넷 확인)")); };
      document.head.appendChild(sc);
    });
  }
  function prepare(){
    if(!clientId()) return Promise.reject(new Error("구글 클라이언트 ID가 없습니다"));
    return loadGis().then(function(){
      if(tokenClient) return;
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId(), scope: "https://www.googleapis.com/auth/drive.file",
        callback: function(r){
          if(!(r && r.access_token)){ setStatus("error", "구글 연결이 취소되었습니다"+(r&&r.error?" ("+r.error+")":"")); return; }
          var okScope = true; try{ okScope = google.accounts.oauth2.hasGrantedAllScopes(r, "https://www.googleapis.com/auth/drive.file"); }catch(e){}
          var c=cfg();
          if(!okScope){ c.granted=false; c.token=null; setStatus("error", "드라이브 권한이 허용되지 않았습니다. ☁️를 다시 눌러 구글 창에서 드라이브 항목에 체크하고 '계속'을 눌러 주세요"); return; }
          c.token=r.access_token; c.tokenExp=Date.now()+(Number(r.expires_in)||3600)*1000; c.granted=true; run();
        },
        error_callback: function(e){ setStatus("error", "구글 연결 창이 열리지 않았습니다 ("+(e&&e.type||"")+")"); }
      });
    });
  }
  /* 사용자가 누를 때만 호출 (팝업 차단 방지) */
  function connect(){
    if(!tokenClient){ prepare().then(function(){ toast("준비되었습니다. ☁️를 한 번 더 눌러 주세요"); paint(); }).catch(function(e){ setStatus("error", e.message); }); return; }
    tokenClient.requestAccessToken({prompt: cfg().granted ? "" : "consent"});
  }
  function api(url, opt){
    opt = opt || {}; opt.headers = Object.assign({Authorization:"Bearer "+tok()}, opt.headers||{});
    return fetch(url, opt).then(function(r){
      if(r.ok) return r;
      return r.text().then(function(t){
        var j={}; try{ j=JSON.parse(t); }catch(e){}
        var er = j.error || {}, reason = ((er.errors&&er.errors[0]&&er.errors[0].reason)||"") + " " + ((er.details||[]).map(function(d){ return d.reason||""; }).join(" ")) + " " + (er.status||"") + " " + (er.message||"");
        var c = cfg();
        if(r.status===401){ c.token=null; throw new Error("NEED_TAP"); }
        if(/accessNotConfigured|SERVICE_DISABLED|has not been used|is disabled/i.test(reason)) throw new Error("구글 콘솔(swgido)에서 'Google Drive API'가 꺼져 있습니다. ⚙︎ 동기화의 안내 링크에서 '사용'을 눌러 주세요");
        if(/insufficient|SCOPE/i.test(reason)){ c.token=null; c.granted=false; throw new Error("드라이브 권한이 허용되지 않았습니다. ☁️를 다시 눌러 구글 창에서 드라이브 항목에 체크하고 '계속'을 눌러 주세요"); }
        if(r.status===403){ c.token=null; throw new Error("드라이브 사용이 거부되었습니다 (403: "+(reason.trim().slice(0,80)||"이유 없음")+")"); }

      });
    });
  }
  function findFile(){
    var c = cfg();
    var q = encodeURIComponent("name='"+SYNC_FILE+"' and trashed=false");
    return api("https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,modifiedTime)&orderBy=modifiedTime%20desc&q="+q).then(function(r){ return r.json(); })
      .then(function(j){ var f = j.files && j.files[0]; c.fileId = f ? f.id : null; return c.fileId; });
  }
  function download(id){ return api("https://www.googleapis.com/drive/v3/files/"+id+"?alt=media").then(function(r){ return r.text(); }); }
  function upload(id, body){
    if(id) return api("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media", {method:"PATCH", headers:{"Content-Type":"application/json"}, body:body}).then(function(r){ return r.json(); });
    var boundary = "swgido"+Date.now(), meta = JSON.stringify({name:SYNC_FILE, mimeType:"application/json"});
    var multipart = "--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+meta+"\r\n--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+boundary+"--";
    return api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {method:"POST", headers:{"Content-Type":"multipart/related; boundary="+boundary}, body:multipart}).then(function(r){ return r.json(); }).then(function(j){ cfg().fileId=j.id; return j; });
  }
  function run(){
    var c = cfg();
    if(!c.on || busy) return Promise.resolve();
    if(!navigator.onLine){ paint(); return Promise.resolve(); }
    if(!tok()){ paint(); return Promise.resolve(); }
    if(!c.pass){ setStatus("error", "비밀 문구를 넣어 주세요 (⚙︎ 설정)"); return Promise.resolve(); }
    busy = true; paint();
    return findFile().then(function(id){
      if(!id) return null;
      return download(id).then(function(txt){ return Crypt.open(txt, c.pass); });
    }).then(function(remote){
      if(remote){
        var fresh = !S.people.length && !S.items.length && !S.notes.length && !(S.promises||[]).length;
        if(fresh && (remote.groups||[]).length){ S.groups = S.groups.filter(function(g){ return !g.def; }); SNAP = snapshot(false); }
        mergeInto(remote);
      }
      return Crypt.seal(JSON.stringify(sharedState()), c.pass);
    }).then(function(body){ return upload(cfg().fileId, body); })
    .then(function(){ busy=false; c.last=Date.now(); setStatus("ok", ""); safeRender(); })
    .catch(function(e){ busy=false;
      if(e.message==="NEED_TAP"){ setStatus("ok",""); }
      else if(e.message==="BAD_PASS") setStatus("error", "비밀 문구가 다른 기기와 다릅니다. 같은 문구를 넣어 주세요");

  function safeRender(){

/* 암호화: 비밀 문구 → PBKDF2(SHA-256, 20만 번) → AES-GCM 256 */
var Crypt = (function(){
  var keyCache = {};
  function b64(buf){ var s="", a=new Uint8Array(buf); for(var i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null, a.subarray(i,i+0x8000)); return btoa(s); }
  function unb64(str){ var s=atob(str), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
  function key(pass, saltB64){
    var k = pass+"|"+saltB64; if(keyCache[k]) return Promise.resolve(keyCache[k]);
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]).then(function(km){
      return crypto.subtle.deriveKey({name:"PBKDF2", salt:unb64(saltB64), iterations:200000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
    }).then(function(kk){ keyCache[k]=kk; return kk; });
  }
  function seal(text, pass){
    var c = Sync.cfg(); if(!c.salt) c.salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return key(pass, c.salt).then(function(k){ return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, k, new TextEncoder().encode(text)); })
      .then(function(ct){ return JSON.stringify({app:"swgido", v:1, enc:"AES-GCM", kdf:"PBKDF2-SHA256-200000", salt:c.salt, iv:b64(iv), data:b64(ct), at:new Date().toISOString()}); });
  }
  function open(txt, pass){
    var f; try{ f = JSON.parse(txt); }catch(e){ return Promise.reject(new Error("동기화 파일이 손상되었습니다")); }
    if(!f.enc) return Promise.resolve(f.people ? f : null);
    Sync.cfg().salt = f.salt;
    return key(pass, f.salt).then(function(k){ return crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(f.iv)}, k, unb64(f.data)); })
      .then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); }, function(){ throw new Error("BAD_PASS"); });
  }
  return {seal:seal, open:open};
})();

/* ---------- OAT 파일 보내기 · 불러오기 ---------- */
function oatExportData(y, owner){
  var strip = function(r){ var o = JSON.parse(JSON.stringify(r)); delete o.mt; delete o.id; if(o.people) o.people = o.people.map(function(x){ return {name:x.pid&&person(x.pid)?person(x.pid).name:x.name, note:x.note}; }); if(o.check){ delete o.check.count; delete o.check.done; } return o; };
  return {app:"swgido-oat", v:1, owner:owner||"", year:y, head:oatHead(y)?strip(oatHead(y)):null, prays:oatPrays(y).map(strip), goals:oatGoals(y).map(strip)};
}
function parseNumberedText(txt){
  var lines = String(txt||"").replace(/\r/g,"").split("\n"), items = [], cur = null;
  lines.forEach(function(l){
    var m = /^\s*(\d{1,2})\s*[.)]\s*(.+)$/.exec(l);
    if(m){ cur = {text:m[2].trim()}; items.push(cur); }
    else if(cur && l.trim()){ cur.text += " " + l.trim(); }
  });
  items.forEach(function(x){ var r = /\(([^()]*\d+:\d+[^()]*)\)\s*\.?\s*$/.exec(x.text); if(r){ x.ref = r[1].replace(/\s+/g," ").trim(); x.text = x.text.slice(0, r.index).trim(); } x.text = x.text.replace(/\s+/g," ").replace(/\.$/,"").trim(); if(x.ref) x.ref = x.ref.replace(/^([가-힣]+)\s*(\d)/,"$1 $2"); });
  return items;
}

  var rows = [];
  if(data){ if(data.head && data.head.theme) rows.push({title:y+" 주제: "+data.head.theme, detail:[data.head.verses?("약속의 말씀: "+data.head.verses):"", data.head.emphasis?("강조: "+data.head.emphasis):""].filter(Boolean).join("\n")}); (data.prays||[]).forEach(function(x){ rows.push({title:x.text, verse:x.ref||""}); }); }
  else (pasted||[]).forEach(function(x){ rows.push({title:x.text, verse:x.ref||""}); });
  var seen = {};
  rows.forEach(function(r){
    seen[r.title] = 1;
    var ex = keep[r.title];
    if(ex){ ex.detail = r.detail || ex.detail; ex.verse = r.verse || ex.verse; ex.updated = today(); }
    else S.items.push({id:uid(), personId:pid, title:r.title, detail:r.detail||"", verse:r.verse||"", source:tag, oatTag:tag, created:today(), updated:today(), due:"", urgent:false, urgentChecked:today(), status:"active", prayed:[], focus:false});
  });

  S.items = S.items.filter(function(it){ return !(it.personId===pid && it.oatTag===tag && !seen[it.title] && it.status==="active"); });
  if(p.circle!=="daily" && p.circle!=="weekly"){ /* 한 달 원이면 그대로 */ }
  save(); return rows.length;
}

var BOOKS = [[1,"창세기","창"],[2,"출애굽기","출"],[3,"레위기","레"],[4,"민수기","민"],[5,"신명기","신"],[6,"여호수아","수"],[7,"사사기","삿"],[8,"룻기","룻"],[9,"사무엘상","삼상"],[10,"사무엘하","삼하"],[11,"열왕기상","왕상"],[12,"열왕기하","왕하"],[13,"역대상","대상"],[14,"역대하","대하"],[15,"에스라","스"],[16,"느헤미야","느"],[17,"에스더","에"],[18,"욥기","욥"],[19,"시편","시"],[20,"잠언","잠"],[21,"전도서","전"],[22,"아가","아"],[23,"이사야","사"],[24,"예레미야","렘"],[25,"예레미야애가","애"],[26,"에스겔","겔"],[27,"다니엘","단"],[28,"호세아","호"],[29,"요엘","욜"],[30,"아모스","암"],[31,"오바댜","옵"],[32,"요나","욘"],[33,"미가","미"],[34,"나훔","나"],[35,"하박국","합"],[36,"스바냐","습"],[37,"학개","학"],[38,"스가랴","슥"],[39,"말라기","말"],[40,"마태복음","마"],[41,"마가복음","막"],[42,"누가복음","눅"],[43,"요한복음","요"],[44,"사도행전","행"],[45,"로마서","롬"],[46,"고린도전서","고전"],[47,"고린도후서","고후"],[48,"갈라디아서","갈"],[49,"에베소서","엡"],[50,"빌립보서","빌"],[51,"골로새서","골"],[52,"데살로니가전서","살전"],[53,"데살로니가후서","살후"],[54,"디모데전서","딤전"],[55,"디모데후서","딤후"],[56,"디도서","딛"],[57,"빌레몬서","몬"],[58,"히브리서","히"],[59,"야고보서","약"],[60,"베드로전서","벧전"],[61,"베드로후서","벧후"],[62,"요한일서","요일"],[63,"요한이서","요이"],[64,"요한삼서","요삼"],[65,"유다서","유"],[66,"요한계시록","계"]];
function findBook(name){
  name = String(name||"").replace(/\s/g,"");
  for(var i=0;i<BOOKS.length;i++) if(BOOKS[i][1]===name || BOOKS[i][2]===name) return BOOKS[i];
  for(i=0;i<BOOKS.length;i++) if(name.length>=2 && BOOKS[i][1].indexOf(name)===0) return BOOKS[i];
  if(name==="시편"||name==="시") return BOOKS[18];
  return null;
}
/* "민5장", "민수기1장", "민3:1-26", "시136 싱가폴" → {b, book, ch, v1, v2, extra, full} */
function parseRef(s){
  s = String(s||"").trim();
  var m = /^([1-3]?\s*[가-힣]+?)\s*(\d+)\s*(?:장|편)?(?:\s*[:：]\s*(\d+)(?:\s*[-~]\s*(\d+))?)?\s*(.*)$/.exec(s);
  if(!m) return null;
  var bk = findBook(m[1]); if(!bk) return null;
  var ch = Number(m[2]), v1 = m[3] ? Number(m[3]) : 0, v2 = m[4] ? Number(m[4]) : 0;
  var unit = bk[0]===19 ? "편" : "장";
  var full = bk[1]+" "+ch+(v1 ? ":"+v1+(v2?"-"+v2:"") : unit);
  return {b:bk[0], book:bk[1], ch:ch, v1:v1, v2:v2, extra:(m[5]||"").trim(), full:full};
}
function bibleUrl(r){
  var base = location.origin + "/bible-reading/";
  if(!r) return base;
  return base + "#go=" + r.b + "." + r.ch + (r.v1 ? "." + r.v1 + (r.v2 ? "-" + r.v2 : "") : "");
}

function qtOn(d){ for(var i=0;i<S.qt.length;i++) if(S.qt[i].date===d) return S.qt[i]; return null; }

var QT_SEED = {"2026-11":"1(일) 시136 싱가폴 2(월) 민수기1장 3(화) 민2장 4(수) 민3:1-26 5(목) 민3:27-51 6(금) 민4:1-20 7(토) 민4:21-33 8(일) 시137 인도네시아 9(월) 민4:34-49 10(화) 민5장 11(수) 민6장 12(목) 민7:1-47 13(금) 민7:48-89 14(토) 민8장 15(일) 시138 말레이시아 16(월) 민9장 17(화) 민10장 18(수) 민11장 19(목) 민12장 20(금) 민13장 21(토) 민14:1-25 22(일) 시139 레바논 23(월) 민14:26-45 24(화) 민15:1-21 25(수) 민15:22-41 26(목) 민16:1-35 27(금) 민16:36-50 28(토) 민17장 29(일) 시140 태국 30(월) 민18:1-20"};
/* 표를 복사해 붙여넣은 글 → [{day, ref}] ("11(수) 민6장" 꼴이 이어져 있으면 됨, 줄바꿈·칸 순서 무관) */
function parsePlanText(txt){
  var out = [], re = /(\d{1,2})\s*\(\s*[일월화수목금토]\s*\)\s*([\s\S]*?)(?=\s*\d{1,2}\s*\(\s*[일월화수목금토]\s*\)|$)/g, m;
  txt = String(txt||"").replace(/날\s*짜|말\s*씀/g," ");
  while((m = re.exec(txt))){ var ref = m[2].replace(/\s+/g," ").trim(); if(ref) out.push({day:Number(m[1]), ref:ref}); }
  return out;
}
function applyPlan(ym, rows){
  var n = 0;
  rows.forEach(function(r){
    if(r.day<1 || r.day>31) return;
    var d = ym+"-"+("0"+r.day).slice(-2), ex = qtPlanOn(d);
    if(ex){ ex.ref = r.ref; } else S.qtplan.push({id:"qp-"+d, date:d, ref:r.ref});
    n++;
  });
  return n;
}
function seedQtPlan(){
  if(S.settings.qtSeeded) return;
  Object.keys(QT_SEED).forEach(function(ym){ if(!S.qtplan.some(function(p){ return p.date.slice(0,7)===ym; })) applyPlan(ym, parsePlanText(QT_SEED[ym])); });
  /* OAT "경건의 시간"(매일 체크)을 묵상 노트에서 자동으로 ✓ 되게 */
  S.oat.forEach(function(g){ if(g.kind==="goal" && /경건/.test(g.title||"") && g.check && g.check.t==="daily") g.check = {t:"auto", src:"qt"}; });
  S.settings.qtSeeded = true;
}

/* 예전(칸이 나뉘어 있던) 기록도 한 칸으로 합쳐 보여 줌 */
function qtBodyOf(q){
  if(!q) return "";
  if(!q.title && !q.verses && !q.prayer) return q.body||"";
  return [q.title ? q.title + (q.passage ? " ("+q.passage+")" : "") : "", q.verses, q.body, q.prayer].filter(function(x){ return x && String(x).trim(); }).join("\n\n");
}
function qtTitleOf(q){ var b = qtBodyOf(q).trim(); return b ? b.split("\n")[0].replace(/\s*\([^()]*\)\s*$/,"").slice(0,60) : ""; }
function qtFormVals(){ return {passage:val("qtPassage"), body:$("#qtBody").value.replace(/\s+$/,""), apply:val("qtApply")}; }
function qtSaveForm(d){
  var v = qtFormVals();
  if(!v.body.trim()) { toast("묵상을 적어 주세요"); return null; }
  var q = qtOn(d); if(!q){ q = {id:"qt-"+d, date:d, created:today()}; S.qt.push(q); }
  Object.assign(q, v); delete q.title; delete q.verses; delete q.prayer;
  /* 적용 → 적용 노트 (이미 만든 노트가 있으면 고침) */
  if(v.apply){
    var n = q.noteId && note(q.noteId);
    if(n){ n.apply = v.apply; n.ref = v.passage; n.learned = qtTitleOf(q); }
    else { n = newNote({ref:v.passage, learned:qtTitleOf(q), apply:v.apply, source:"QT", date:d}); S.notes.push(n); q.noteId = n.id; }
  }
  try{ localStorage.removeItem(qtDraftKey(d)); }catch(e){}
  save(); return q;
}

function qtText(q){ var b = qtBodyOf(q).trim(); return b + (q.apply ? "\n\n적용: " + q.apply : ""); }
function qtShareText(q){

/* ============ 찾기 (색인) ============
   머리줄 🔍 → 사람·기도제목·묵상·적용·감사·약속·OAT를 한 번에 찾는다.
   사람 이름을 찾으면 그 사람의 기도제목이 바로 아래에 나오고, 🌿 응답 단추로 곧장 응답을 적는다. */
function srNorm(s){ return String(s||"").toLowerCase().replace(/\s+/g,""); }
function srHit(text, q){
  if(!q) return false; var t = srNorm(text), n = srNorm(q);
  if(t.indexOf(n) >= 0) return true;
  if(/^[ㄱ-ㅎ]+$/.test(n) && chosung(t).indexOf(n) >= 0) return true;   /* 초성 찾기: ㄱㅇㅎ → 김욱한 */
  if(/^\d{3,}$/.test(n) && t.replace(/\D/g,"").indexOf(n) >= 0) return true;  /* 전화번호 숫자 */
  return false;
}
function srMark(text, q, max){
  text = String(text||""); var plain = text.replace(/\s+/g," ").trim(), qq = String(q||"").trim();
  var i = qq ? plain.toLowerCase().indexOf(qq.toLowerCase()) : -1;
  if(max && plain.length > max){ var st = Math.max(0, i - 20); plain = (st ? "…" : "") + plain.slice(st, st + max) + (st + max < plain.length ? "…" : ""); i = qq ? plain.toLowerCase().indexOf(qq.toLowerCase()) : -1; }
  if(i < 0) return esc(plain);
  return esc(plain.slice(0,i)) + '<mark>' + esc(plain.slice(i, i+qq.length)) + '</mark>' + esc(plain.slice(i+qq.length));
}
function srStatus(it){ return {active:"기도 중", answered:"🌿 응답", other:"🌿 다르게 응답", waiting:"기다림", released:"내려놓음"}[it.status] || ""; }
function srItemRow(it, q, showPerson){
  var p = person(it.personId), ans = it.status==="answered" || it.status==="other";
  return '<div class="srrow"><div class="srmain" data-act="openItem" data-id="'+it.id+'">'+
    (showPerson ? '<div class="tiny muted">'+(p ? esc(p.name) : (it.personId==="me" ? "나" : "받은 제목"))+' · '+srStatus(it)+'</div>' : '')+
    '<div>'+srMark(it.title, q)+(showPerson ? '' : ' <span class="tiny muted">'+srStatus(it)+'</span>')+'</div>'+
    (it.answerText && srHit(it.answerText, q) ? '<div class="small muted">응답: '+srMark(it.answerText, q, 60)+'</div>' : '')+
    (it.detail && srHit(it.detail, q) ? '<div class="small muted">'+srMark(it.detail, q, 60)+'</div>' : '')+'</div>'+
    (ans ? '' : '<button class="btn sm" data-act="srAnswer" data-id="'+it.id+'">🌿 응답</button>')+'</div>';
}
function searchResults(q){
  q = String(q||"").trim(); if(!q) return '<div class="empty">사람 이름, 기도제목, 묵상, 감사… 무엇이든 찾을 수 있습니다.<div class="tiny" style="margin-top:6px">이름은 초성으로도 찾습니다 (예: ㄱㅇㅎ)</div></div>';
  var h = "", total = 0, LIM = 30;
  var sec = function(title, rows){ if(!rows.length) return; total += rows.length; h += '<div class="srsec">'+title+' <span class="tiny muted">'+rows.length+'</span></div><div class="srlist">'+rows.slice(0,LIM).join("")+(rows.length>LIM?'<div class="tiny muted" style="padding:8px 0">… '+(rows.length-LIM)+'개 더 — 낱말을 더 붙여 찾아 보세요</div>':'')+'</div>'; };
  /* 1. 사람 + 그 사람의 기도 중인 제목 */
  var ppl = S.people.filter(function(p){ return srHit(p.name, q) || srHit(p.memo, q) || srHit(p.phone, q); }).sort(function(a,b){ return a.name.localeCompare(b.name,"ko"); });
  var shownItems = {};
  sec("👤 사람", ppl.map(function(p){
    var g = group(p.groupId), its = S.items.filter(function(it){ return it.personId===p.id && (it.status==="active"||it.status==="waiting"); });
    its.forEach(function(it){ shownItems[it.id] = 1; });
    return '<div class="srperson"><div class="srrow"><div class="srmain" data-act="openPerson" data-id="'+p.id+'"><b style="font-size:17px">'+srMark(p.name, q)+'</b> <span class="tiny muted">'+(g?esc(g.name):"")+'</span>'+
      (p.memo && srHit(p.memo, q) && !srHit(p.name, q) ? '<div class="small muted">'+srMark(p.memo, q, 60)+'</div>' : '')+'</div>'+
      '<button class="btn sm" data-act="quickAdd" data-pid="'+p.id+'">＋ 제목</button></div>'+
      (its.length ? its.map(function(it){ return srItemRow(it, "", false); }).join("") : '<div class="tiny muted" style="padding:2px 0 6px">기도 중인 제목 없음</div>')+'</div>';
  }));
  /* 2. 기도제목 (사람 칸에 이미 나온 것은 빼고) */
  sec("🙏 기도제목", S.items.filter(function(it){ return !shownItems[it.id] && (srHit(it.title, q) || srHit(it.detail, q) || srHit(it.answerText, q) || srHit(it.verse, q)); })
    .sort(function(a,b){ return (b.updated||b.created||"") < (a.updated||a.created||"") ? -1 : 1; }).map(function(it){ return srItemRow(it, q, true); }));
  /* 3. 묵상 노트 */
  sec("✍️ 묵상 노트", S.qt.filter(function(x){ return qtWritten(x) && (srHit(qtText(x), q) || srHit(x.passage, q)); }).sort(function(a,b){ return a.date<b.date?1:-1; })
    .map(function(x){ return '<div class="srrow"><div class="srmain" data-act="qtOpen" data-date="'+x.date+'"><div class="tiny muted">'+fmtDate(x.date)+(x.passage?' · '+esc(x.passage):'')+'</div><div>'+esc(qtTitleOf(x))+'</div><div class="small muted">'+srMark(qtText(x), q, 70)+'</div></div></div>'; }));
  /* 4. 적용 노트 */
  sec("📖 적용 노트", S.notes.filter(function(n){ return srHit([n.ref,n.learned,n.apply,n.fix,n.speaker,n.source].join(" "), q); })
    .map(function(n){ return '<div class="srrow"><div class="srmain" data-act="openNote" data-id="'+n.id+'"><div class="tiny muted">'+esc(n.date||"")+(n.source?' · '+esc(n.source):'')+(n.ref?' · '+esc(n.ref):'')+'</div><div>'+srMark(n.apply||n.fix||n.learned||"", q, 70)+'</div></div></div>'; }));
  /* 5. 감사 */
  var th = []; Object.keys(S.logs).sort().reverse().forEach(function(d){ var L = S.logs[d]; (L.thanks||[]).concat(L.evening && L.evening.thanks ? [L.evening.thanks] : []).forEach(function(x){ if(x && srHit(x, q)) th.push('<div class="srrow"><div class="srmain" data-act="srThanks"><div class="tiny muted">'+fmtDate(d)+'</div><div>'+srMark(x, q, 70)+'</div></div></div>'); }); });
  sec("🌿 감사", th);
  /* 6. 약속 · 붙든 말씀 */
  sec("🤝 약속 · 붙든 말씀", S.promises.filter(function(x){ return srHit([x.ref,x.word,x.text,x.context,x.kairos].join(" "), q); })
    .map(function(x){ return '<div class="srrow"><div class="srmain" data-act="openPromise" data-id="'+x.id+'"><div class="tiny muted">'+PKIND[x.kind].name+(x.ref?' · '+esc(x.ref):'')+'</div><div>'+srMark(x.text||x.word, q, 70)+'</div></div></div>'; }));
  /* 7. OAT */
  sec("🎯 OAT", S.oat.filter(function(r){ return r.kind!=="year" && srHit([r.text,r.title,r.detail,r.ref,(r.people||[]).map(function(x){ return x.name+" "+x.note; }).join(" ")].join(" "), q); })
    .map(function(r){ return '<div class="srrow"><div class="srmain" data-act="oatOpen" data-id="'+r.id+'"><div class="tiny muted">'+r.year+' · '+(r.kind==="pray"?"장기기도제목":esc(AREA_NAME[r.area]||""))+'</div><div>'+srMark(r.text||r.title, q, 70)+'</div>'+
      ((r.people||[]).filter(function(x){ return srHit(x.name+" "+x.note, q); }).map(function(x){ return '<div class="small muted">'+srMark(x.name+(x.note?": "+x.note:""), q)+'</div>'; }).join(""))+'</div></div>'; }));
  return total ? h : '<div class="empty">"'+esc(q)+'"(으)로 찾은 것이 없습니다.</div>';
}
function searchSheet(q){
  q = q != null ? q : (UI.searchQ || "");
  openSheet("🔍 찾기", '<input type="search" id="srIn" value="'+esc(q)+'" placeholder="이름, 기도제목, 묵상, 감사…" autocomplete="off" enterkeyhint="search"><div id="srRes">'+searchResults(q)+'</div>', function(){
    var el = $("#srIn"), t0 = null;
    el.addEventListener("input", function(){ clearTimeout(t0); t0 = setTimeout(function(){ UI.searchQ = el.value; $("#srRes").innerHTML = searchResults(el.value); }, 150); });
    if(!q) setTimeout(function(){ try{ el.focus(); }catch(e){} }, 120);
  });
}
Object.assign(ACT, {
  search:function(){ searchSheet(); },
  srAnswer:function(b){
    var it = item(b.dataset.id); if(!it) return;
    UI.backToSearch = true; itemSheet(it);
    var btn = document.querySelector('[data-radio="iStatus"] [data-v="answered"]'); if(btn) btn.click();
    setTimeout(function(){ var a = $("#iAns"); if(a){ a.focus(); a.scrollIntoView({block:"center"}); } }, 150);
  },
  srThanks:function(){ closeSheet(); UI.tab="answers"; UI.ansView="thanks"; UI.thanksQ = UI.searchQ || ""; render(); window.scrollTo(0,0); }
});
/* 찾기에서 응답을 적고 저장하면 다시 찾기 결과로 돌아온다 */
(function(){ var orig = ACT.saveItem; ACT.saveItem = function(b, e){ var back = UI.backToSearch; UI.backToSearch = false; orig(b, e); if(back) setTimeout(function(){ searchSheet(UI.searchQ); }, 50); }; })();

load(); seedQtPlan(); if(dedupeGroups()) save(); else save({noSync:true}); render(); Sync.onOpen();
/* 카카오톡 등에서 "공유 → 쉬지 않는 기도"로 들어온 글 */
(function(){ try{
  var q = new URLSearchParams(location.search);
  if(q.get("share")){
    var txt = [q.get("title"), q.get("text"), q.get("url")].filter(function(x){ return x && x.trim(); }).join("\n").trim();
    history.replaceState(null, "", location.pathname);
    if(txt) setTimeout(function(){ quickSheet(undefined, "item", txt); toast("받은 글을 기도제목으로 넣습니다. 누구를 위한 것인지 고르세요"); }, 300);
  }
}catch(e){} })();
try{ if(sessionStorage.getItem("swgido.picking")){ sessionStorage.removeItem("swgido.picking"); setTimeout(function(){ toast("연락처를 고르는 사이 화면이 새로 열려 추가되지 않았습니다. 한 번 더 해 주세요"); }, 400); } }catch(e){}
window.addEventListener("error", function(e){ toast("오류: "+(e.message||"")); });
window.addEventListener("unhandledrejection", function(e){ var r=e.reason; toast("오류: "+((r&&(r.message||r.name))||r||"")); });
</script>
