<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>말씀암송</title>
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="말씀암송">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{
  --bg:#111111;--sf:#1b1b1b;--sf2:#242424;--bd:#2e2e2e;--tx:#E6E6E6;--tx2:#A0A0A0;--tx3:#727272;
  --ac:#E8B04A;--acTx:#141414;--acSoft:rgba(232,176,74,.14);
  --red:#E5605A;--org:#E39443;--blu:#6AA5EC;--grn:#53B883;--gold:#E8B04A;
  --fs:20px;--fw:400;--lh:1.8;--ls:0em;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#F6F4EF;--sf:#FFFFFF;--sf2:#EFECE5;--bd:#DDD8CC;--tx:#1C1C1C;--tx2:#5B5B5B;--tx3:#8B8B8B;
  --ac:#A86E0C;--acTx:#FFFFFF;--acSoft:rgba(168,110,12,.10);
  --red:#C8423B;--org:#C56E1A;--blu:#2F6FC0;--grn:#2E8B57;--gold:#A86E0C;color-scheme:light;
}
@media (prefers-color-scheme:light){:root[data-theme=auto]{
  --bg:#F6F4EF;--sf:#FFFFFF;--sf2:#EFECE5;--bd:#DDD8CC;--tx:#1C1C1C;--tx2:#5B5B5B;--tx3:#8B8B8B;
  --ac:#A86E0C;--acTx:#FFFFFF;--acSoft:rgba(168,110,12,.10);
  --red:#C8423B;--org:#C56E1A;--blu:#2F6FC0;--grn:#2E8B57;--gold:#A86E0C;color-scheme:light;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.5;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:contain}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:var(--tx)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:640px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
#app.nonav{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.top .ttl{font-size:21px;font-weight:700;letter-spacing:-.01em}
.top .sub{font-size:13px;color:var(--tx2);margin-top:1px}
.top .grow{flex:1;min-width:0}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--sf);border:1px solid var(--bd);flex:none}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.h2{font-size:15px;font-weight:700;color:var(--tx2);margin:22px 2px 8px}
.muted{color:var(--tx2)}.small{font-size:13px}.tiny{font-size:12px;color:var(--tx3)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;font-size:17px;font-weight:700;background:var(--sf2);border:1px solid var(--bd);margin:10px 0;padding:0 14px}
.btn.pri{background:var(--ac);color:var(--acTx);border-color:var(--ac)}
.btn.sm{min-height:42px;font-size:15px;font-weight:600;border-radius:12px;margin:6px 0}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.todo .trow{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--bd);font-size:17px}
.todo .trow:last-child{border-bottom:0}
.todo .trow b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.todo .trow b.zero{color:var(--tx3)}
.todo .trow b.pt{font-size:17px;color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--tx2)}
.bar{height:6px;background:var(--sf2);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:4px}
.note{background:var(--acSoft);border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}
.note.warn{background:color-mix(in srgb,var(--red) 12%,transparent);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--sf);border:1px solid var(--bd);font-size:15px;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--acTx);border-color:var(--ac);font-weight:700}
.seg{display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:15px;color:var(--tx2)}
.seg button.on{background:var(--sf2);color:var(--tx);font-weight:700;box-shadow:0 0 0 1px var(--bd)}
.search{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:0 12px;margin:4px 0 10px}
.search input{flex:1;background:none;border:0;outline:0;padding:12px 0;font-size:16px}
.list{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin:8px 0}
.row{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-bottom:1px solid var(--bd);min-height:58px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .go{color:var(--tx3);font-size:18px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--tx3)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:10px;background:var(--sf2);color:var(--tx2);font-weight:600}
.badge .dot{width:7px;height:7px}
.addb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;border:1px solid var(--bd);background:var(--sf2);flex:none;color:var(--tx2)}
.addb.on{background:var(--acSoft);color:var(--ac);border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.subh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 6px}
.subh b{font-size:15px}
.subh button{white-space:nowrap;flex:none;font-size:13px;color:var(--ac);font-weight:600;padding:6px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.bk{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 8px;text-align:center;font-size:15px}
.bk small{display:block;color:var(--tx3);font-size:12px}
html.zh .vt{word-break:normal;line-break:strict}
.vt{font-size:var(--fs);font-weight:var(--fw);line-height:var(--lh);letter-spacing:var(--ls);word-break:keep-all;overflow-wrap:anywhere}
.ref{font-size:19px;color:var(--ac);font-weight:700}
.vtitle{font-size:22px;font-weight:700;margin:2px 0 4px;letter-spacing:-.01em}
.crumb{font-size:13px;color:var(--tx2)}
.memo{border:1px dashed var(--bd);border-radius:14px;padding:12px 14px;background:transparent;margin:12px 0}
.memo .lab{font-size:12px;color:var(--tx3);margin-bottom:6px}
.memo textarea,.ta{width:100%;min-height:84px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:16px;outline:0;resize:vertical}
.inp{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:16px;outline:0}
.steps{display:flex;gap:4px;margin:6px 0 4px}
.steps button{flex:1;height:34px;border-radius:9px;background:var(--sf);border:1px solid var(--bd);font-size:13px;color:var(--tx3);font-weight:600}
.steps button.on{background:var(--ac);color:var(--acTx);border-color:var(--ac)}
.steps button.done{color:var(--tx);border-color:color-mix(in srgb,var(--ac) 50%,transparent)}
.stepname{font-size:18px;font-weight:700;margin:12px 0 2px}
.stepdesc{font-size:14px;color:var(--tx2);margin-bottom:6px}
.stage{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px 16px;margin:10px 0;min-height:140px}
.w{display:inline}
.w.hid{color:transparent;background:var(--sf2);border-radius:6px;box-shadow:inset 0 -2px 0 var(--tx3);cursor:pointer}
.w.rev{color:var(--ac)}
.w.hint{color:var(--tx2);cursor:pointer}
.chunk{padding:8px 10px;border-radius:10px;margin:4px 0;color:var(--tx3)}
.chunk.cur{background:var(--acSoft);color:var(--tx);font-weight:600}
.chunk.past{color:var(--tx2)}
.miss{color:var(--red);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cover{display:grid;place-items:center;text-align:center;color:var(--tx3);min-height:120px;border:1px dashed var(--bd);border-radius:12px;padding:14px;font-size:15px}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.grades button{border-radius:14px;padding:12px 8px;font-size:17px;font-weight:700;border:1.5px solid;background:var(--sf);min-height:64px}
.grades button small{display:block;font-size:12px;font-weight:500;color:var(--tx2);margin-top:2px}
.g-again{border-color:var(--red)!important;color:var(--red)}
.g-hard{border-color:var(--org)!important;color:var(--org)}
.g-good{border-color:var(--blu)!important;color:var(--blu)}
.g-easy{border-color:var(--grn)!important;color:var(--grn)}
.counter{display:flex;gap:10px;justify-content:center;margin:12px 0}
.counter i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ac)}
.counter i.on{background:var(--ac)}
.chk{display:flex;align-items:flex-start;gap:10px;padding:14px;border-bottom:1px solid var(--bd)}
.chk:last-child{border-bottom:0}
.chk .main{flex:1;min-width:0}
.pf{display:flex;gap:6px;margin-top:10px}
.pf button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--bd);font-weight:700;font-size:16px;background:var(--sf2)}
.pf button.ok.on{background:var(--grn);border-color:var(--grn);color:#fff}
.pf button.no.on{background:var(--red);border-color:var(--red);color:#fff}
.cb{width:26px;height:26px;border-radius:8px;border:2px solid var(--bd);display:grid;place-items:center;flex:none;font-size:15px;color:transparent;margin-top:1px}
.cb.on{background:var(--ac);border-color:var(--ac);color:var(--acTx)}
.opt{display:block;width:100%;text-align:left;padding:14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--sf);font-size:17px;font-weight:600;margin:8px 0}
.opt.right{border-color:var(--grn);color:var(--grn)}
.opt.wrong{border-color:var(--red);color:var(--red)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--bd)}
.setrow:last-child{border-bottom:0}
.setrow .lab{font-size:16px}.setrow .lab small{display:block;font-size:12px;color:var(--tx3)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--sf2);border:1px solid var(--bd);font-size:18px;font-weight:700}
.stepper span{min-width:52px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
details.guide{border-bottom:1px solid var(--bd);padding:2px 0}
details.guide:last-child{border-bottom:0}
details.guide summary{padding:13px 2px;font-size:16px;font-weight:600;list-style:none;cursor:pointer}
details.guide summary::after{content:"＋";float:right;color:var(--tx3)}
details.guide[open] summary::after{content:"－"}
details.guide div{padding:0 2px 14px;color:var(--tx2);font-size:15px;line-height:1.65}
.msg{border-left:3px solid var(--ac);padding:4px 0 4px 10px;margin:6px 0;color:var(--tx)}
#nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
#nav .in{display:flex;max-width:640px;width:100%}
#nav button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--tx3)}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--ac);font-weight:700}
#nav.hide{display:none}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:88vw;text-align:center}
#toast.on{opacity:1}
#upd{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;background:var(--ac);color:var(--acTx);padding:10px 14px;border-radius:14px;font-weight:700;display:none;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35);width:max-content;max-width:92vw}
#upd button{background:var(--acTx);color:var(--ac);padding:6px 10px;border-radius:9px;font-weight:700}
.prog{font-size:14px;color:var(--tx2);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--tx2);padding:28px 10px}
.kpill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:9px;background:var(--sf2)}
.diffbox{background:var(--sf2);border-radius:12px;padding:12px;margin-top:10px}
.pct{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.vitem{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0}
.vhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.vhead b{font-size:16px}.vnum{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;min-width:22px}
.flash{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:20px 18px;margin:12px 0;min-height:300px;touch-action:pan-y}
.vref2{text-align:right;margin-top:6px;font-size:14px;opacity:.9}
.vitem.playing{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.say{margin-left:auto;font-size:18px;padding:2px 6px;border-radius:8px}
#ttsbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom));width:min(608px,calc(100% - 32px));display:flex;gap:6px;background:var(--sf2);border:1px solid var(--bd);border-radius:16px;padding:6px;z-index:15;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#ttsbar .tb{flex:1;min-height:44px;border-radius:11px;font-weight:700;font-size:15px;background:var(--sf);border:1px solid var(--bd)}
#ttsbar .tb.main{flex:1.6;background:var(--ac);color:var(--acTx);border-color:var(--ac)}
#ttsbar .tb:disabled{opacity:.4}
/* 말씀 카드 — 늘 펼쳐 보고 싶은 종이 카드 느낌 */
.paper{background:#F7F9E1;color:#000;border-radius:18px;padding:18px 18px 14px;margin:10px 0;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 18px rgba(0,0,0,.18);font-family:"Noto Sans KR","Pretendard Variable",Pretendard,sans-serif;position:relative;border:0}
.paper .vt{font-family:"Noto Sans KR","Pretendard Variable",Pretendard,sans-serif;font-weight:400;color:#000}
.paper .pcrumb{font-size:12px;color:#8A8F70;margin-bottom:4px}
.paper .ptitle{color:#BE77D8;font-weight:700;font-size:19px;letter-spacing:-.01em}
.paper .ptitle.big{font-size:23px}
.paper .pref{color:#23A065;font-weight:700;font-size:19px;letter-spacing:-.01em;margin-top:2px}
.flash .pref{font-size:23px}
.paper .pver{color:#8A8F70;font-weight:400;font-size:13px;letter-spacing:0}
.paper .pref2{text-align:right;margin-top:8px}
.paper .pbody{margin-top:10px}
.paper .cover{border-color:rgba(0,0,0,.2);color:#6F735A;background:rgba(255,255,255,.35)}
.paper .chunk{color:#A3A78B}.paper .chunk.past{color:#4a4a3e}.paper .chunk.cur{background:rgba(190,119,216,.16);color:#000}
.paper .w.hid{background:#E2E6BE;box-shadow:inset 0 -2px 0 #B5BB8E}
.paper .w.rev{color:#A65BC2}.paper .w.hint{color:#5D6148}
.paper .diffbox{background:#ECEFCF;color:#000}
.paper .miss{color:#D2342C}
.paper .badge{background:rgba(0,0,0,.06);color:#4a4a3e}
.paper .addb{background:rgba(255,255,255,.5);border-color:rgba(0,0,0,.12);color:#8A8F70}
.paper .addb.on{color:#BE77D8;border-color:#BE77D8;background:rgba(190,119,216,.1)}
.paper.vitem{padding:14px 16px 10px}
.paper .vhead{margin-bottom:0}.paper .vnum{color:#8A8F70}
.paper .say{color:#23A065}
.paper.playing{box-shadow:0 0 0 3px #BE77D8,0 6px 18px rgba(0,0,0,.18)}
hr.sep{border:0;border-top:1px solid var(--bd);margin:14px 0}
</style>
</head>
<body>
<div id="upd"><span>새 버전이 있어요</span><button data-act="doUpdate">지금 업데이트</button></div>
<div id="app"></div>
<nav id="nav"><div class="in">
  <button data-act="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>오늘</button>
  <button data-act="tab" data-v="browse"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/></svg>말씀</button>
  <button data-act="tab" data-v="mine"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>내 목록</button>
  <button data-act="tab" data-v="pair"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 3-5 6-5s6 2 6 5"/><path d="M14 15.3c.6-.2 1.3-.3 2-.3 3 0 6 2 6 5"/></svg>짝 점검</button>
  <button data-act="tab" data-v="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>설정</button>
</div></nav>

<script>

/* text/ref는 "암송 언어"를 고르면 그 번역본으로 바뀌어 보이도록 getter로 둔다 (원문은 ko/koRef) */
function langify(c){c.ko=c.text;c.koRef=c.ref;delete c.text;delete c.ref;
  Object.defineProperty(c,"text",{get(){return(LANG.ready&&LANG.tx[this.id])||this.ko},enumerable:true,configurable:true});
  Object.defineProperty(c,"ref",{get(){return(LANG.ready&&LANG.rf[this.id])||this.koRef},enumerable:true,configurable:true});return c}
const CARDS=DATA.map(a=>langify({no:a[0],id:a[1],cat:a[2],sub:a[3],title:a[4],ref:a[5],text:a[6],vc:a[7],b:a[8],ch:a[9],v:a[10],vs:a[11]}));
const BYID={},BYNO={};CARDS.forEach(c=>{BYID[c.id]=c;BYNO[c.no]=c});
const CATS=[],SUBS={};
CARDS.forEach(c=>{if(!SUBS[c.cat]){SUBS[c.cat]=[];CATS.push(c.cat)}if(!SUBS[c.cat].includes(c.sub))SUBS[c.cat].push(c.sub)});
const nz=s=>String(s||"").replace(/\s+/g,"").toLowerCase();
function indexCard(c){c.s=nz([c.title,c.koRef,c.b>=0?BOOKS[c.b][1]+c.ch+":"+c.v:"",c.cat,c.sub,c.ko].join(" "));c.rk=c.b+"|"+String(c.koRef).replace(/^[가-힣]+/,"").replace(/\s|\(.*?\)|[상하]$/g,"")}
CARDS.forEach(indexCard);

/* 내가 만든 구절: S.custom[id] = {id,u(카테고리 id),title,ref,text,ver,b,ch,v,vc,at} / 카테고리: S.ucats=[{id,name}] */
function ucatName(u){const c=(S.ucats||[]).find(x=>x.id===u);return c?c.name:"분류 없음"}
function rebuildCustom(){
  for(let i=CARDS.length-1;i>=0;i--)if(CARDS[i].custom){delete BYID[CARDS[i].id];CARDS.splice(i,1)}

    langify(c);indexCard(c);CARDS.push(c);BYID[c.id]=c});
  rebuildSame();
}

const KEY="malsseum-amsong-v1";
let S={};
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
  if(typeof S!=="object"||!S)S={};
  S.cards=S.cards||{};S.mylist=S.mylist||[];S.custom=S.custom||{};S.ucats=S.ucats||[];S.log=S.log||{};S.checks=S.checks||[];S.applied=S.applied||[];
  S.set=Object.assign({name:"",partner:"",newPerDay:2,maxReview:30,dir:"ref",hint:"cho",fs:20,fw:400,lh:1.8,ls:0,theme:"dark",installHide:0},S.set||{});
  if(!S.seeded){
    for(const id in SEED){if(!BYID[id])continue;const d=SEED[id];
      S.cards[id]={lv:3,g:"easy",last:d,started:d,due:addDays(d,7),hint:true,h:[[d,"easy"]],reps:1};
      if(!S.mylist.includes(id))S.mylist.push(id)}
    S.seeded=1;save();
  }
  rebuildCustom();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("기기에 저장하지 못했어요")}}

/* ---------- 날짜 ---------- */
const z2=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+z2(d.getMonth()+1)+"-"+z2(d.getDate());
const today=()=>ymd(new Date());
function pd(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)}
function diffDays(a,b){return Math.round((Date.UTC(...ymdArr(b))-Date.UTC(...ymdArr(a)))/864e5)}
function ymdArr(s){const[y,m,d]=s.split("-").map(Number);return[y,m-1,d]}
function fmtD(s){if(!s)return"";const n=diffDays(today(),s);if(n===0)return"오늘";if(n===1)return"내일";if(n===-1)return"어제";if(n>1&&n<7)return n+"일 뒤";if(n<0)return(-n)+"일 지남";const d=pd(s);return(d.getMonth()+1)+"월 "+d.getDate()+"일"}
function dateKo(s){const d=s?pd(s):new Date();return(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+"일월화수목금토"[d.getDay()]+")"}

/* ---------- 복습 간격 ---------- */
function IV(lv){if(lv<=0)return 1;if(lv<=5)return[1,1,3,7,14,30][lv];return Math.min(180,30*Math.pow(2,lv-5))}
function nextOf(r,g){
  r=r||{};let lv=r.lv||0,focus=false,days;
  if(g==="again"){lv=0;days=1;focus=true}
  else if(g==="hard"){lv=Math.max(0,lv-1);days=1;focus=true}
  else if(g==="good"){lv=Math.max(1,lv)+((r.g==="good"&&lv>=1)?1:0);days=IV(lv)}
  else{lv=lv===0?2:lv+1;days=IV(lv)}
  return{lv,focus,days}
}
function ivLabel(d){if(d<=1)return"내일";if(d<7)return d+"일 뒤";if(d<28)return Math.round(d/7)+"주 뒤";return Math.round(d/30)+"개월 뒤"}
const GR={again:["다시 배우기","g-again"],hard:["많이 어려움","g-hard"],good:["조금 어려움","g-good"],easy:["수월함","g-easy"]};
function startCard(id){const t=today();if(!S.cards[id]){S.cards[id]={lv:0,started:t,due:t,h:[],reps:0};const lg=logT();(lg.newIds=lg.newIds||[]).push(id);save()}}
function applyGrade(id,g,kind){
  const t=today();const r=S.cards[id]||(S.cards[id]={lv:0,started:t,h:[],reps:0});
  const n=nextOf(r,g);r.lv=n.lv;r.focus=n.focus;r.g=g;r.last=t;r.due=addDays(t,n.days);r.reps=(r.reps||0)+1;
  if(n.lv>=1)r.hint=true;(r.h=r.h||[]).push([t,g]);if(r.h.length>30)r.h.shift();
  if(kind!=="new"){const lg=logT();lg.rev=(lg.rev||0)+1}
  save();
}
function logT(){const t=today();if(!S.log[t])S.log[t]={};const ks=Object.keys(S.log).sort();while(ks.length>90)delete S.log[ks.shift()];return S.log[t]}

function st(id){const r=S.cards[id];if(!r||(!r.reps&&!r.started))return"new";if(r.focus)return"focus";if(r.lv>=5)return"long";if(r.lv>=1)return"known";if(r.hint)return"hint";return"learning"}

  return o;
}
function plan(){
  const t=today(),due=[],focus=[];
  for(const id in S.cards){const r=S.cards[id];if(!BYID[id]||!r.due)continue;if(r.due<=t)(r.focus?focus:due).push(id)}
  const by=(a,b)=>S.cards[a].due<S.cards[b].due?-1:S.cards[a].due>S.cards[b].due?1:0;
  due.sort(by);focus.sort(by);
  const lg=S.log[t]||{};const max=S.set.maxReview;
  const backlog=due.length+focus.length>max;
  const cap=Math.max(0,max-(lg.rev||0));
  const f2=focus.slice(0,cap),rev=due.slice(0,Math.max(0,cap-f2.length));
  let nNew=Math.max(0,S.set.newPerDay-(lg.newIds||[]).length);if(backlog)nNew=0;
  const news=S.mylist.filter(id=>BYID[id]&&!S.cards[id]).slice(0,nNew);
  return{focus:f2,rev,news,backlog,dueTotal:due.length+focus.length,lg};
}

function enc(o){const b=new TextEncoder().encode(JSON.stringify(o));let s="";b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))))}

function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const isSyl=c=>{const k=c.charCodeAt(0);return k>=0xAC00&&k<=0xD7A3};
const cho=w=>[...w].map(ch=>isSyl(ch)?CHO[Math.floor((ch.charCodeAt(0)-0xAC00)/588)]:ch).join("");
function firstOnly(w){let out="",done=false;for(const ch of w){if(/[\p{L}\p{N}]/u.test(ch)){out+=done?"○":ch;done=true}else out+=ch}return out}
const hintW=w=>(S.set.hint==="first"||!/[가-힣]/.test(w))?firstOnly(w):cho(w);
function chunks(text){
  if(isCJK(text)){const ps=text.replace(/\s+/g,"").split(/(?<=[，。；：！？])/).filter(Boolean),o=[];ps.forEach(x=>{if(o.length&&[...x].length<4)o[o.length-1]+=x;else o.push(x)});return o}
  const w=words(text),out=[];let cur=[];
  const END=/(고|며|니|나|라|면|서|되|요|다|여|매|니라|도다|지라|리라|느니라|더라|하사|하시고)[,.;:!?'"」』)]*$/;
  for(const x of w){cur.push(x);const p=/[,.;:!?]["'」』)]*$/.test(x);
    if((p&&cur.length>=2)||(cur.length>=3&&END.test(x))||cur.length>=6){out.push(cur.join(" "));cur=[]}}
  if(cur.length){if(cur.length<2&&out.length)out[out.length-1]+=" "+cur.join(" ");else out.push(cur.join(" "))}
  return out;
}

/* 입력 채점: 글자 단위 비교 (띄어쓰기 무시) */
function grade(orig,typed){
  const isL=ch=>/[\p{L}\p{N}]/u.test(ch);
  const A=[...orig],ai=[],a=[];A.forEach((ch,i)=>{if(isL(ch)){ai.push(i);a.push(ch.toLowerCase())}});
  const b=[...typed].filter(isL).map(ch=>ch.toLowerCase());const n=a.length,m=b.length;
  const W=m+1;const dp=new Uint16Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*W+j]=a[i]===b[j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
  const ok=new Array(A.length).fill(true);let i=0,j=0;const hit=new Array(n).fill(false);
  while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(dp[(i+1)*W+j]>=dp[i*W+j+1])i++;else j++}
  hit.forEach((h,k)=>{if(!h)ok[ai[k]]=false});
  const got=hit.filter(Boolean).length;
  let html="";A.forEach((ch,k)=>{html+=ok[k]?esc(ch):`<span class="miss">${esc(ch)}</span>`});
  return{pct:n?Math.round(100*got/n):0,html,extra:m-got};
}

const STEPN=["읽기","나누어 외우기","일부 가리기","힌트 암송","전체 암송","결과 기록"];

function ph(c,hideRef){return`<div class="pcrumb">${crumbOf(c)}</div><div class="ptitle">${esc(c.title)}</div>${hideRef?"":`<div class="pref">${esc(c.ref)} <span class="pver">${esc(verName(c))}</span></div>`}`}
const paper=(c,body,tail=true)=>`<div class="paper">${ph(c)}<div class="pbody">${body}</div>${tail?`<div class="pref pref2">${esc(c.ref)}</div>`:""}</div>`;
function head(c){return ph(c)}
function learnHTML(c){

  const W=words(c.text),SEP=sepOf(c.text);

  }else if(L.step===2){

  }else if(L.step===3){
    const order=W.map((_,i)=>i);const R=rng(hash32(c.id));for(let i=order.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[order[i],order[j]]=[order[j],order[i]]}

  }else if(L.step===4){

    const r=S.cards[c.id];
    h+=`<button class="btn sm ${r&&r.hint?"":"pri"}" data-act="hintOk" data-id="${c.id}">${r&&r.hint?"✓ 힌트 보고 외울 수 있어요":"힌트 보고 외울 수 있어요"}</button>`;
  }else if(L.step===5){
    h+=fullRecallHTML(c,L);
  }else{
    h+=paper(c,`<div class="vt">${esc(c.text)}</div>`);
    h+=`<div class="memo"><div class="lab">어려웠던 부분 (선택)</div><textarea data-in="hard" placeholder="예: ‘미쁘사’ 다음 부분이 자꾸 막힘">${esc(L.hard)}</textarea></div>`;

}

VIEWS.recv=(p)=>{
  const d=p.p;const items=(d.i||[]).map((n,k)=>({c:ckCard(n),ok:d.r[k]==="1"})).filter(x=>x.c);
  const pass=items.filter(x=>x.ok).length;const done=S.applied.includes(p.raw.slice(-40));
  let h=`<header class="top"><button class="back" data-act="tabHome">✕</button><div class="grow"><div class="ttl">짝 점검 결과</div><div class="sub">${esc(d.n||"짝")}님이 확인 · ${dateKo(d.d)}</div></div></header>`;
  h+=`<div class="card" style="text-align:center"><div class="pct">${pass} / ${items.length}</div><div class="muted">통과</div>${d.m?`<div class="msg" style="text-align:left;margin-top:12px">${esc(d.m)}</div>`:""}</div>`;
  h+=`<div class="list">${items.map(x=>`<div class="row"><div class="main"><div class="t1">${esc(x.c.title)}</div><div class="t2">${esc(x.c.ref)}</div></div><b style="color:${x.ok?"var(--grn)":"var(--red)"}">${x.ok?"통과":"다시"}</b></div>`).join("")}</div>`;
  const noData=!Object.keys(S.cards).length;
  if(noData&&!isStandalone())h+=`<div class="note warn small">이 브라우저에는 암송 기록이 없어요. 설치한 ‘말씀암송’ 앱에서 기록하려면 아래 ‘결과 복사’를 누른 뒤, 앱의 <b>짝 점검 › 받은 결과 붙여넣기</b>에 붙여넣어 주세요.</div>`;
  h+=done?`<button class="btn" disabled>이미 내 기록에 반영했어요</button>`:`<button class="btn pri" data-act="applyRecv">내 기록에 반영하기</button>`;
  h+=`<button class="btn sm" data-act="copyRecv">결과 복사</button>`;
  return h;
};
function applyResult(d,raw,self){
  const items=(d.i||[]).map((n,k)=>({c:ckCard(n),ok:d.r[k]==="1"})).filter(x=>x.c&&BYID[x.c.id]);const t=today();
  items.forEach(({c,ok})=>{const r=S.cards[c.id]||(S.cards[c.id]={lv:0,started:t,due:t,h:[],reps:0});(r.pc=r.pc||[]).push({d:d.d||t,by:d.n||"",ok});if(r.pc.length>10)r.pc.shift();if(!ok){r.focus=true;r.due=t}});
  S.checks.push({dir:"recv",d:d.d||t,by:d.n,total:items.length,pass:items.filter(x=>x.ok).length,msg:d.m||"",self:!!self});
  if(S.checks.length>100)S.checks.shift();
  if(raw)S.applied.push(raw.slice(-40));if(S.applied.length>200)S.applied.shift();
  save();
}

/* ---------- 성경읽기 앱 자료 (같은 주소의 기기 저장소 bible_app_db) ---------- */
const KNOWN_LABELS={"korhrv":"개역한글판","kornkrv":"개역개정","engesv":"ESV","enggnt":"GNT(Good News)","engniv":"NIV","engnasb":"NASB","engmsg":"The Message","engnkjv":"NKJV","engkjv":"KJV","enghcsb":"HCSB","engcev":"CEV","engisv":"ISV","engnlt":"NLT","engnrsv":"NRSV","engtniv":"TNIV","ckhhrv":"개역한글 국한문판","ckhktv":"바른성경 국한문판","ckhnkrv":"개역개정 국한문판","kchnkrv":"개역개정 국한문판","korcath":"가톨릭 성경","kordob":"우리말성경","koreasy":"쉬운성경","korhchv":"한글 킹제임스 성경","korhkjv":"킹제임스 흠정역","개역한글":"개역한글판","개역개정":"개역개정판","korklb":"현대인의 성경","korktv":"바른성경","kornkcb":"공동번역 성서 개정판","kornrsv":"새번역","kortkv":"현대어성경"};
const BIB={state:"unknown",vers:{},zips:{},chap:{},db:undefined,loading:null};
const idbReq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function bibOpen(){
  if(BIB.db)return Promise.resolve(BIB.db);
  if(!("indexedDB"in window))return Promise.resolve(null);
  return new Promise(res=>{try{
    const rq=indexedDB.open("bible_app_db");let created=false;
    /* 성경읽기 앱을 이 기기에서 쓴 적이 없으면 저장소가 없다 — 이때 빈 저장소를 만들어 버리면
       나중에 성경읽기 앱이 고장 나므로, 새로 만들어지려 하면 취소한다 */
    rq.onupgradeneeded=e=>{created=true;try{e.target.transaction.abort()}catch(_){}};
    rq.onsuccess=()=>{const db=rq.result;if(created||!db.objectStoreNames.contains("files")){db.close();res(null);return}
      db.onversionchange=()=>{db.close();BIB.db=undefined};BIB.db=db;res(db)};
    rq.onerror=e=>{try{e.preventDefault()}catch(_){}res(null)};rq.onblocked=()=>res(null);
  }catch(e){res(null)}});
}
function bibLabel(key,display){let m={};try{m=JSON.parse(localStorage.getItem("bible_labels_v1")||"{}")||{}}catch(e){}return m[key]||KNOWN_LABELS[key]||display}
function bibLoad(){
  if(BIB.state==="ready")return Promise.resolve(true);
  if(BIB.loading)return BIB.loading;
  BIB.loading=(async()=>{try{
    const db=await bibOpen();if(!db){BIB.state="none";return false}
    const keys=await idbReq(db.transaction("files").objectStore("files").getAllKeys());BIB.vers={};
    (keys||[]).forEach(k=>{const parts=String(k).replace(/\\/g,"/").split("/").filter(Boolean);const f=parts.pop()||"";
      if(!/\.lfa$/i.test(f)||parts.some(d=>/^mp3$/i.test(d)))return;const disp=f.replace(/\.lfa$/i,""),key=disp.toLowerCase();
      const pr=BIB.vers[key];if(!pr||parts.length<pr.depth)BIB.vers[key]={key,label:bibLabel(key,disp),depth:parts.length,path:k}});
    BIB.state=Object.keys(BIB.vers).length?"ready":"none";return BIB.state==="ready";
  }catch(e){BIB.state="none";return false}finally{BIB.loading=null}})();
  return BIB.loading;
}
const isKo=l=>/[가-힣]/.test(l);
function bibVersions(){return Object.values(BIB.vers).sort((a,b)=>(isKo(a.label)?0:1)-(isKo(b.label)?0:1)||a.label.localeCompare(b.label,"ko"))}
function bibDefault(){const v=BIB.vers;return v[S.set.addVer]?S.set.addVer:v.korhrv?"korhrv":v.kornkrv?"kornkrv":(bibVersions()[0]||{}).key}
function loadJSZip(){if(window.JSZip)return Promise.resolve(window.JSZip);return new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";sc.onload=()=>res(window.JSZip);sc.onerror=()=>rej(new Error("jszip"));document.head.appendChild(sc)})}
async function bibZip(vk){
  if(BIB.zips[vk])return BIB.zips[vk];
  const v=BIB.vers[vk];const db=await bibOpen();const item=await idbReq(db.transaction("files").objectStore("files").get(v.path));
  const JS=await loadJSZip();const blob=item&&(item.file||item);const z=await JS.loadAsync(await blob.arrayBuffer());BIB.zips[vk]=z;return z;
}
function bapt(t){let m="sere";try{m=JSON.parse(localStorage.getItem("bible_baptism_v1"))||"sere"}catch(e){}return m==="original"?t:t.replace(/침례/g,"세례")}
async function bibChapter(vk,bn,ch){
  const ck=vk+"|"+bn+"|"+ch;if(BIB.chap[ck])return BIB.chap[ck];
  const z=await bibZip(vk);const suf=(String(bn).padStart(2,"0")+"_"+ch+".lfb").toLowerCase();
  const name=Object.keys(z.files).find(n=>{const l=n.toLowerCase();return l.endsWith("/"+suf)||l===suf||l.endsWith("\\"+suf)})||Object.keys(z.files).find(n=>n.toLowerCase().endsWith(suf));
  if(!name)return null;
  const txt=await z.files[name].async("text");const out=[];
  txt.split(/\r?\n/).forEach(l=>{const m=/^\S+\s+(\d+):(\d+)\s+(.*)$/.exec(l.trim());if(m)out.push({v:+m[2],t:bapt(m[3].replace(/^"|"$/g,"").trim())})});
  out.sort((a,b)=>a.v-b.v);BIB.chap[ck]=out;return out;
}
function joinVerses(list){let s="";list.forEach((x,i)=>{if(i)s+=(x.v===list[i-1].v+1)?" ":" …";s+=x.t});return s}

/* ---------- 주소 읽기 ---------- */
const BK_ALIAS=(()=>{const a=[];BOOKS.forEach((b,i)=>{a.push([b[0],i]);a.push([b[1],i])});
  [["렘애",24],["애가",24],["시편",18],["요한1서",61],["요한2서",62],["요한3서",63],["요1서",61],["요2서",62],["요3서",63],["빌레몬",56],["계시록",65],["전서",-1]].forEach(x=>{if(x[1]>=0)a.push(x)});
  return a.sort((x,y)=>y[0].length-x[0].length)})();
function parseRef(str){
  const s=String(str||"").replace(/\s+/g,"").replace(/：/g,":").replace(/[~～–—]/g,"-").replace(/\(.*?\)/g,"").replace(/(\d)[상하ab]$/,"$1").replace(/\.$/,"");
  for(const[nm,i]of BK_ALIAS){
    if(!s.startsWith(nm))continue;
    const r=s.slice(nm.length).replace(/[장편]/,":").replace(/절/g,"").replace(/:$/,"");
    const m=/^(\d+)(?::(\d+(?:-\d+)?(?:,\d+(?:-\d+)?)*))?$/.exec(r);if(!m)continue;
    let vs=[];if(m[2])m[2].split(",").forEach(p=>{const[a,b]=p.split("-").map(Number);if(b&&b>=a){for(let k=a;k<=b&&k-a<200;k++)vs.push(k)}else vs.push(a)});
    vs=[...new Set(vs)].sort((a,b)=>a-b);
    return{b:i,ch:+m[1],vs};
  }
  return null;
}
function compactVs(vs){const o=[];let i=0;while(i<vs.length){let j=i;while(j+1<vs.length&&vs[j+1]===vs[j]+1)j++;o.push(j>i?vs[i]+"-"+vs[j]:String(vs[i]));i=j+1}return o.join(",")}
const refOf=p=>BOOKS[p.b][0]+p.ch+(p.vs.length?":"+compactVs(p.vs):"");
/* ---------- 앞뒤 문맥 보기: 성경읽기 앱을 그 장으로 열고 암송 구절을 표시 ---------- */
function ctxOk(c){return c&&c.b>=0&&c.ch>0}
function ctxUrl(c){
  const vs=cardVs(c)||[];
  /* 지금 보고 있는 번역본으로 연다: 영어·중국어를 골랐으면 그 번역본, 내 구절은 저장한 번역본, 기본 869구절은 개역한글 */
  const ver=(LANG.ready&&S.set.lang)?S.set.lang:c.custom?(c.ver||""):"korhrv";
  return new URL("../bible-reading/",location.href).href+"#go="+(c.b+1)+"."+c.ch+"."+compactVs(vs)+(ver?"&v="+encodeURIComponent(ver):"")+"&from=amsong&id="+encodeURIComponent(c.id);
}
function openCtx(id){
  const c=BYID[id];if(!ctxOk(c)){toast("장절을 알 수 없는 구절이에요");return}
  /* 새 창(탭)을 따로 열지 않고 같은 창에서 성경읽기로 넘어간다. 그래야 성경읽기의 ‹ 암송으로 나
     휴대폰 뒤로 가기로 방금 보던 이 구절 화면에 그대로 돌아올 수 있다. */
  location.href=ctxUrl(c);
}
const ctxBtn=(c,cls="btn sm")=>ctxOk(c)?`<button class="${cls}" data-act="ctx" data-id="${c.id}">📖 앞뒤 문맥 보기</button>`:"";
function parsePaste(raw){
  const t=String(raw||"").split(/\n/).filter(l=>!/^\s*📝/.test(l)).join(" ").replace(/\s+/g," ").trim();if(!t)return null;
  let m=/^([\s\S]*?)\s*\(([^()]*?\d+\s*[:장][^()]*?)\)\s*$/.exec(t);
  if(m){const mm=/^(.*?\d+\s*[:장]\s*[\d,\-~ 절]*\d절?)\s*(.*)$/.exec(m[2].trim());const p=mm&&parseRef(mm[1]);if(p)return{p,text:m[1].trim(),ver:(mm[2]||"").trim()}}
  m=/^([가-힣0-9]+\s?\d+\s*[:장]\s*[\d,\-~]+절?)\s+([\s\S]+)$/.exec(t);
  if(m){const p=parseRef(m[1]);if(p)return{p,text:m[2].trim(),ver:""}}
  return{p:null,text:t,ver:""};
}

/* ---------- 받은 구절 (성경읽기 앱 → 암송 앱) ---------- */
const INBOX="amsong_inbox_v1";
function inboxGet(){try{const a=JSON.parse(localStorage.getItem(INBOX)||"[]");return Array.isArray(a)?a.filter(x=>x&&x.t):[]}catch(e){return[]}}
function inboxRemove(id){if(!id)return;try{localStorage.setItem(INBOX,JSON.stringify(inboxGet().filter(x=>x.id!==id)))}catch(e){}}
const preRef=x=>{try{return refOf({b:x.b-1,ch:x.ch,vs:x.vs||[]})}catch(e){return""}};
VIEWS.inbox=()=>{
  const ib=inboxGet();
  let h=topbar("성경읽기에서 보낸 구절",ib.length+"개",true);
  if(!ib.length)return h+`<div class="empty">모두 정리했어요</div>`;
  return h+`<div class="list">${ib.slice().reverse().map(x=>`<div class="chk"><div class="main"><div class="ref">${esc(preRef(x))} <span class="tiny">${esc(x.ver||"")}</span></div><div class="small" style="margin-top:4px;color:var(--tx2)">${esc(String(x.t).slice(0,90))}${String(x.t).length>90?"…":""}</div>
    <div class="pf"><button class="ok on" data-act="ibTake" data-id="${esc(x.id)}">담기</button><button data-act="ibDrop" data-id="${esc(x.id)}">버리기</button></div></div></div>`).join("")}</div>`;
};

  const a={edit:null,refIn:"",vk:null,u:S.set.lastUcat&&S.ucats.some(c=>c.id===S.set.lastUcat)?S.set.lastUcat:(S.ucats[0]||{}).id||"",title:"",ref:"",text:"",ver:"",paste:"",inMine:true,inboxId:null,busy:false};

function tableRows(arr,sheet){

    const rj=refScore.indexOf(Math.max(...refScore));if(refScore[rj]<.5)return[];
    let tj=-1,best=0;len.forEach((L,j)=>{if(j!==rj&&refScore[j]<.5&&L>best){best=L;tj=j}});
    let ttl=-1;for(let j=rj-1;j>=0;j--)if(j!==tj&&refScore[j]<.5){ttl=j;break}

}

  const out=[];let cat="",i=0;const used=new Set();
  while(i<lines.length){
    const l=lines[i];if(!l){i++;continue}
    const hd=/^(?:#+\s*|\[|【|<)(.+?)(?:\]|】|>)?$/.exec(l);
    if(hd&&/^(#|\[|【|<)/.test(l)&&!isRef(hd[1])){cat=hd[1].trim();i++;continue}
    if(isRef(l)){
      const ref=l.replace(/^[(\[]|[)\]]$/g,"");let title="";if(i>0&&lines[i-1]&&!used.has(i-1)&&!isRef(lines[i-1]))title=lines[i-1];
      const body=[];let j=i+1;
      for(;j<lines.length;j++){const x=lines[j];if(!x){if(body.length&&j+1<lines.length&&isRef(lines[j+2]||""))break;continue}
        if(isRef(x)){const p1=parseRef(ref),p2=parseRef(x.replace(/^[(\[]|[)\]]$/g,""));if(p1&&p2&&keyOf(p1)===keyOf(p2)){used.add(j);j++;break}
          if(body.length>=2){body.pop();j--}break}
        body.push(x);used.add(j)}
      out.push({cat,title,ref,text:body.join(" "),rev:false});used.add(i);i=Math.max(j,i+1);continue;
    }
    if(!used.has(i)&&!(i+1<lines.length&&isRef(lines[i+1]))){const pp=parsePaste(l);if(pp&&pp.p){out.push({cat,title:"",ref:refOf(pp.p),text:pp.text,ver:pp.ver,rev:false});used.add(i)}}
    i++;
  }
  return out;
}
async function readImportFile(file){
  const name=file.name.toLowerCase();
  if(/\.json$/.test(name)){const j=JSON.parse(await file.text());const d=j.data||j;if(!d.cards&&!d.custom)throw new Error("json");
    const r=mergeBackup(d);toast(`백업을 합쳤어요 · 내 구절 ${r.nC}개, 기록 ${r.nR}개`);nav("home",{},true);return null}
  if(/\.(xlsx|xls|xlsm|ods)$/.test(name)){const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:"array"});let rows=[];
    wb.SheetNames.forEach(sn=>{const arr=X.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:""});rows=rows.concat(tableRows(arr,sn).map(r=>(r.cat||wb.SheetNames.length<2?r:Object.assign(r,{cat:sn}))))});return rows}
  const t=await file.text();if(/\.csv$/.test(name))return tableRows(parseCSV(t));return textRows(t);
}
function analyzeImport(rows){
  const bk=builtinKeys(),ck=customKeys(),seen=new Set();
  rows.forEach(r=>{r.title=String(r.title||"").trim();r.ref=String(r.ref||"").trim();r.text=String(r.text||"").replace(/\s+/g," ").trim();r.p=parseRef(r.ref);
    if(!r.text||!r.ref){r.st="bad";return}
    const tk="t:"+tnorm(r.text),k=r.p&&r.p.vs.length?keyOf(r.p):tk;
    if(bk.ref.has(k)||bk.text.has(tnorm(r.text))){r.st="builtin";r.bid=bk.ref.get(k)||bk.text.get(tnorm(r.text));return}
    if(ck.has(k)||ck.has(tk)){r.st="mine";return}
    if(seen.has(k)||seen.has(tk)){r.st="dup";return}
    seen.add(k);seen.add(tk);r.st="new"});
  return rows;
}

  impText:()=>{const rows=textRows(IM.paste);IM.rows=analyzeImport(rows);IM.open="";if(!rows.length)toast("장절을 찾지 못했어요. 제목/장절/본문/장절 순서로 줄을 바꿔 적어 주세요");rerender()},
  impShow:t=>{IM.open=IM.open===t.dataset.v?"":t.dataset.v;rerender()},
  impMine:()=>{IM.mine=!IM.mine;rerender()},
  impProg:()=>{IM.prog=!IM.prog;rerender()},
  impGo:()=>impApply(),
  reset:()=>{if(!RESETARM){RESETARM=true;rerender();setTimeout(()=>{RESETARM=false;if(V.v==="more")rerender()},4000);return}RESETARM=false;const keep=S.set;S={set:keep,seeded:1};save();load();toast("기록을 모두 지웠어요");nav("home",{},true)},
  install:async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;rerender()},
  hideInstall:()=>{S.set.installHide=1;save();rerender()},
  openExternal:()=>{location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(base())},
  checkUpd:()=>checkUpdate(true),
  addNew:()=>openAdd(),
  progHide:()=>{S.progHide=1;save();rerender()},
  goAll:()=>{nav("all",{tab:"browse"});if(BIB.state==="unknown")bibLoad().then(()=>{if(V.v==="all")rerender()})},
  alCat:t=>{if(TTS.on)ttsStop();AL.cat=t.dataset.v;AL.i=0;TTS.idx=0;render();window.scrollTo(0,0)},
  alMode:t=>{AL.mode=t.dataset.v;rerender()},
  alGo:t=>{AL.i+=+t.dataset.d;if(TTS.on)ttsStart(AL.i);else render()},
  ttsPlay:()=>ttsStart(AL.mode==="card"?AL.i:(TTS.idx&&TTS.idx<alItems().length?TTS.idx:0)),
  ttsStop:()=>ttsStop(),
  ttsSkip:t=>ttsSkip(+t.dataset.d),
  ttsFrom:(t,e)=>{e.stopPropagation();ttsStart(+t.dataset.i)},
  ttsRate:()=>{const R=[0.7,0.8,0.9,1,1.1,1.2,1.4];const k=R.indexOf(S.set.ttsRate||1);S.set.ttsRate=R[(k+1)%R.length];save();rerender();toast("다음 문장부터 "+S.set.ttsRate.toFixed(1)+"배")},
  ttsRep:()=>{S.set.ttsRep=((S.set.ttsRep||1)%3)+1;save();rerender()},
  alHide:()=>{AL.hide=!AL.hide;rerender()},
  alOpen:t=>{const c=alItems()[+t.dataset.i];if(c)nav("card",{id:c.id,tab:"browse"})},
  goInbox:()=>nav("inbox",{tab:"home"}),
  ibTake:t=>{const x=inboxGet().find(y=>y.id===t.dataset.id);if(x)openAdd(x)},
  ibDrop:t=>{inboxRemove(t.dataset.id);rerender()},
  adFetch:()=>adFetch(),
  adPasteGo:()=>{const r=parsePaste(AD.paste);if(!r){toast("붙여넣은 내용이 없어요");return}AD.text=r.text;if(r.p){AD.ref=AD.refIn=refOf(r.p)}if(r.ver)AD.ver=r.ver;toast(r.p?"주소와 본문을 나눴어요":"주소를 찾지 못했어요. 주소 칸에 적어 주세요");rerender()},
  adCat:t=>{AD.u=t.dataset.id;rerender()},
  adNewCat:()=>{const id=newUcat();if(id){AD.u=id;rerender()}},
  adMine:()=>{AD.inMine=!AD.inMine;rerender()},
  adSave:()=>adSave(),
  editCustom:t=>openAdd(null,t.dataset.id),
  delCustom:t=>{const id=t.dataset.id;if(DELARM!==id){DELARM=id;rerender();setTimeout(()=>{if(DELARM===id){DELARM=null;if(V.v==="card")rerender()}},4000);return}
    DELARM=null;delete S.custom[id];delete S.cards[id];S.mylist=S.mylist.filter(x=>x!==id);save();rebuildCustom();toast("삭제했어요");BR.tab="my";nav("browse",{},true)},
  ucNew:()=>{if(newUcat()){rebuildCustom();rerender()}},
  ucRen:t=>{const c=S.ucats.find(x=>x.id===t.dataset.id);if(!c)return;const n=(prompt("카테고리 이름",c.name)||"").trim();if(n){c.name=n;save();rebuildCustom();rerender()}},
  ucDel:t=>{const id=t.dataset.id;if(DELARM!==id){DELARM=id;rerender();setTimeout(()=>{if(DELARM===id){DELARM=null;if(V.v==="browse")rerender()}},4000);return}
    DELARM=null;S.ucats=S.ucats.filter(x=>x.id!==id);save();rebuildCustom();toast("카테고리를 지웠어요 (구절은 ‘분류 없음’으로)");rerender()},
  ucIn:t=>{const n=addMine(CARDS.filter(c=>c.custom&&(c.ucat||"")===t.dataset.id).map(c=>c.id));toast(n+"개를 내 목록에 담았어요");rerender()},
  ucOut:t=>{removeMine(CARDS.filter(c=>c.custom&&(c.ucat||"")===t.dataset.id).map(c=>c.id));toast("내 목록에서 뺐어요");rerender()},
  doUpdate:()=>doUpdate(),
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener("input",e=>{const t=e.target;const k=t.dataset&&t.dataset.in;if(!k)return;const v=t.value;
  if(k==="q"){BR.q=v;clearTimeout(window._qt);window._qt=setTimeout(()=>{const pos=t.selectionStart;render();const n=$("#q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},250)}
  else if(k==="memo"){const id=t.dataset.id;if(!S.cards[id]&&!v.trim())return;S.cards[id]=S.cards[id]||{lv:0,h:[],reps:0};S.cards[id].memo=v;save()}
  else if(k==="hard")L.hard=v;
  else if(k==="adRefIn")AD.refIn=v;
  else if(k==="lang")setLang(v);
  else if(k==="pgN"){const cur=CATS.find(c=>PG.st[c]==="cur");const tot=cur?BUILT.filter(c=>c.cat===cur).length:0;PG.n=Math.max(0,Math.min(tot,parseInt(v)||0));clearTimeout(window._pgT);window._pgT=setTimeout(()=>{rerender();const n=$("[data-in=pgN]");if(n)n.focus()},600)}
  else if(k==="impPaste")IM.paste=v;
  else if(k==="impDef")IM.defCat=v;
  else if(k==="adVk"){AD.vk=v;S.set.addVer=v;save();if(parseRef(AD.refIn))adFetch()}
  else if(k==="adPaste")AD.paste=v;
  else if(k==="adText")AD.text=v;
  else if(k==="adRef")AD.ref=v;
  else if(k==="adVer")AD.ver=v;
  else if(k==="adTitle")AD.title=v;
  else if(k==="typed"){const it=curItem();((it.k==="new"||it.learn)?L:RV).typed=v}
  else if(k==="setName"){S.set.name=v.trim();save()}
  else if(k==="setPartner"){S.set.partner=v.trim();save()}
  else if(k==="ckWho")CK.who=v;
  else if(k==="ckMsg")CK.msg=v;
});

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.in==="adRefIn"){e.preventDefault();e.target.blur();adFetch()}});
/* ---------- 링크 처리 ---------- */
function handleHash(h){
  const o=/#open=([^&]+)/.exec(h||"");
  if(o){const id=decodeURIComponent(o[1]);if(BYID[id]){V={v:"home",p:{}};try{history.replaceState(V,"",base())}catch(e){}nav("card",{id})}else{V={v:"home",p:{}};try{history.replaceState(V,"",base())}catch(e){}render()}return true}
  const m=/#(check|result|add)=([\w-]+)/.exec(h||"");if(!m)return false;let p;
  try{p=dec(m[2])}catch(e){toast("링크가 잘못되었어요");return false}
  if(m[1]==="add"){AD=makeAD(p);nav("add",{tab:"browse"});bibLoad().then(()=>{if(V.v==="add")rerender()})}
  else if(m[1]==="check"){CK=null;nav("check",{mode:"partner",from:p.n,d:p.d,i:p.i||[]})}
  else nav("recv",{p,raw:m[2]});
  try{history.replaceState(V,"",base())}catch(e){}
  return true;
}

/* ---------- 설치 · 업데이트 ---------- */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(TABS.includes(V.v))rerender()});
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isKakao=()=>/KAKAOTALK/i.test(navigator.userAgent);
function installBanner(){
  if(isStandalone())return"";
  if(isKakao())return`<div class="note warn small"><b>카카오톡 안에서는 설치가 안 돼요.</b> 아래 버튼으로 크롬(아이폰은 사파리)에서 열어 주세요.<button class="btn sm pri" data-act="openExternal">다른 브라우저로 열기</button></div>`;
  if(deferredPrompt&&!S.set.installHide)return`<div class="note small"><b>홈 화면에 설치</b>하면 앱처럼 바로 열고 인터넷 없이도 연습할 수 있어요.<div class="btns"><button class="btn sm pri" data-act="install">설치하기</button><button class="btn sm" data-act="hideInstall">나중에</button></div></div>`;
  return"";
}
function makeIcon(sz){try{const c=document.createElement("canvas");c.width=c.height=sz;const x=c.getContext("2d");x.fillStyle="#111111";x.fillRect(0,0,sz,sz);
  x.strokeStyle="#E8B04A";x.lineWidth=sz*.035;const p=sz*.2;x.beginPath();x.moveTo(sz/2,sz*.3);x.quadraticCurveTo(sz*.33,sz*.24,p,sz*.27);x.lineTo(p,sz*.7);x.quadraticCurveTo(sz*.33,sz*.67,sz/2,sz*.73);x.quadraticCurveTo(sz*.67,sz*.67,sz-p,sz*.7);x.lineTo(sz-p,sz*.27);x.quadraticCurveTo(sz*.67,sz*.24,sz/2,sz*.3);x.lineTo(sz/2,sz*.73);x.stroke();
  x.fillStyle="#E8B04A";x.beginPath();x.arc(sz/2,sz*.16,sz*.045,0,7);x.fill();return c.toDataURL("image/png")}catch(e){return""}}
function setupManifest(){
  const i192=makeIcon(192),i512=makeIcon(512);const start=base();
  const m={name:"말씀암송",short_name:"말씀암송",start_url:start,scope:start,id:start,display:"standalone",background_color:"#111111",theme_color:"#111111",lang:"ko",
    icons:i192?[{src:i192,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]:[]};
  const l=document.createElement("link");l.rel="manifest";l.href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l);
  if(i192){const a=document.createElement("link");a.rel="apple-touch-icon";a.href=makeIcon(180);document.head.appendChild(a)}
}
let NEWB=null;
async function checkUpdate(manual){
  if(!/^https?:/.test(location.protocol))return;
  try{const r=await fetch(base()+"?_="+Date.now(),{cache:"no-store"});const t=await r.text();const m=/const BUILD="([^"]+)"/.exec(t);
    if(m&&m[1]!==BUILD){NEWB=m[1];$("#upd").style.display="flex"}else if(manual)toast("최신 판이에요 ("+BUILD+")")}catch(e){if(manual)toast("인터넷 연결을 확인해 주세요")}
}
async function doUpdate(){
  try{if("caches"in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
  try{const rs=await navigator.serviceWorker?.getRegistrations();if(rs)for(const r of rs)await r.update()}catch(e){}
  location.replace(base()+"?v="+(NEWB||Date.now()));
}

/* ---------- 시작 ---------- */
load();setDisplay();setupManifest();
if(S.set.lang)loadLang(S.set.lang);
if(!handleHash(location.hash)){
  /* 성경읽기에서 뒤로 가기로 돌아왔는데 페이지를 새로 불러온 경우에도 보던 화면을 그대로 보여 준다 */
  const st=history.state;
  if(st&&st.v&&VIEWS[st.v]&&!NONAV.includes(st.v)&&(st.v!=="card"||BYID[(st.p||{}).id])){V=st;render()}
  else{V={v:"home",p:{}};try{history.replaceState(V,"",base())}catch(e){}render()}
}
if("serviceWorker"in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
setTimeout(()=>checkUpdate(false),2500);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkUpdate(false);if(V.v==="home")rerender()}});
matchMedia("(prefers-color-scheme: light)").addEventListener?.("change",()=>setDisplay());
</script>
